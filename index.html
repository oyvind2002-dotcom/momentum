*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:'Space Grotesk',Inter,sans-serif;margin:0;letter-spacing:-.015em;line-height:1.2}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit;color:inherit}
a{color:var(--purple)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--deep);color:#fff}
.top-in{max-width:1160px;margin:0 auto;padding:0 24px;height:64px;display:flex;align-items:center;gap:20px;position:relative}
.brand{display:flex;align-items:center;gap:10px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:20px;letter-spacing:-.02em;white-space:nowrap}
.mark{width:32px;height:32px;border-radius:10px;background:var(--gold);display:grid;place-items:center}
.tabs{display:flex;gap:2px;height:100%;margin-left:12px}
.tab{border:0;background:none;padding:0 16px;font-weight:500;color:rgba(255,255,255,.72);height:100%;position:relative}
.tab:hover{color:#fff;background:rgba(255,255,255,.05)}
.tab.on{color:#fff;font-weight:600}
.tab.on::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--gold)}
.right{display:flex;align-items:center;gap:8px;margin-left:auto}
.demo-pill{font-size:12px;font-weight:600;color:var(--gold);border:1px solid rgba(232,177,74,.45);padding:4px 10px;border-radius:999px;white-space:nowrap}
.hbtn{display:inline-flex;gap:7px;align-items:center;height:40px;padding:0 13px;border-radius:999px;border:1px solid rgba(255,255,255,.2);background:transparent;color:#fff;font-weight:600;font-size:14px;white-space:nowrap}
.hbtn:hover{background:rgba(255,255,255,.08)}
.hbtn.on{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.icon-btn{position:relative;width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:transparent;display:grid;place-items:center}
.icon-btn:hover{background:rgba(255,255,255,.08)}
.icon-btn.light{border-color:var(--line);background:#fff}
.badge{position:absolute;top:-6px;right:-6px;min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--gold);color:var(--ink);font-size:11px;font-weight:700;display:grid;place-items:center}
.av-btn{border:0;background:none;padding:0;border-radius:50%;display:block}
.edit-bar{background:var(--gold);color:var(--ink);text-align:center;padding:8px 16px;font-weight:600;font-size:14px}
[contenteditable="true"]{outline:1.5px dashed #B89AD3;outline-offset:3px;cursor:text}
[contenteditable="true"]:focus{outline:2px solid var(--gold)}

/* ---------- hero ---------- */
.hero{color:#fff;background:radial-gradient(circle at 92% -20%,rgba(255,255,255,.10) 0 260px,transparent 261px),radial-gradient(circle at 0% 140%,rgba(232,177,74,.16) 0 260px,transparent 261px),var(--purple);position:relative}
.hero-in{max-width:1160px;margin:0 auto;padding:36px 24px 92px}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap}
.page-head h1{font-size:34px;font-weight:700;color:#fff}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.hero .eyebrow{color:var(--gold)}
.hero .sub{color:#DCCBEB;margin-top:6px}
.hero .chips{margin-top:22px}
.hello{display:flex;align-items:center;gap:18px}
.hero-meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.hero-chip{font-size:13px;font-weight:500;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);padding:5px 11px;border-radius:999px;color:#fff}
.hero-chip b{color:var(--gold)}
.crumbs{display:flex;gap:8px;align-items:center;margin-bottom:16px;color:#CDB8E0;font-size:14px;flex-wrap:wrap}
.crumbs button{background:none;border:0;color:#fff;text-decoration:underline;text-underline-offset:3px;padding:6px 0;font-weight:500}

main{max-width:1160px;margin:-56px auto 0;padding:0 24px 110px;position:relative}

/* ---------- cards & basics ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-sharp);padding:24px;box-shadow:0 1px 2px rgba(42,16,64,.04),0 12px 32px rgba(42,16,64,.06)}
.card.accent{box-shadow:inset 0 4px 0 var(--gold),0 1px 2px rgba(42,16,64,.04),0 12px 32px rgba(42,16,64,.06)}
.card.accent-purple{box-shadow:inset 0 4px 0 var(--purple),0 1px 2px rgba(42,16,64,.04),0 12px 32px rgba(42,16,64,.06)}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.card-head h2{font-size:20px;margin-top:4px}
.muted{color:var(--muted)}
.small{font-size:13px}
.stack{display:flex;flex-direction:column;gap:14px}
.grid2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:start}
.grid2even{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:34px 0 14px}
.section-title h2{font-size:22px}

.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 16px;font-weight:600;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:14px}
.btn:hover{border-color:#C7B6D6;background:var(--soft)}
.btn.primary{background:var(--purple);border-color:var(--purple);color:#fff}
.btn.primary:hover{background:var(--deep)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.btn.gold:hover{background:#DDA23A}
.btn.ghost-light{background:transparent;border-color:rgba(255,255,255,.4);color:#fff}
.btn.ghost-light:hover{background:rgba(255,255,255,.08)}
.linkbtn{border:0;background:none;padding:6px 0;font-weight:600;color:var(--purple);min-height:36px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.fchip{border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;border-radius:999px;padding:7px 15px;font-weight:500;min-height:38px;font-size:14px}
.fchip.on{background:#fff;border-color:#fff;color:var(--purple);font-weight:600}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--tint);color:var(--purple);white-space:nowrap}
.tag.pos{background:var(--green-tint);color:var(--green)}
.tag.neg{background:var(--coral-tint);color:var(--coral)}
.tag.obs{background:var(--gold-tint);color:var(--gold-ink)}
.tag.grey{background:#EEEAF1;color:var(--muted)}
.note{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;color:var(--muted)}
.empty{border:1px dashed #D3C5E0;border-radius:12px;padding:16px;color:var(--muted);font-size:14px;background:var(--soft)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:20px}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r-sharp);padding:18px 20px;box-shadow:inset 0 4px 0 var(--purple),0 12px 32px rgba(42,16,64,.06)}
.stat.gold{box-shadow:inset 0 4px 0 var(--gold),0 12px 32px rgba(42,16,64,.06)} .stat.green{box-shadow:inset 0 4px 0 var(--green),0 12px 32px rgba(42,16,64,.06)} .stat.coral{box-shadow:inset 0 4px 0 var(--coral),0 12px 32px rgba(42,16,64,.06)}
.stat-v{font-family:'Space Grotesk',sans-serif;font-size:30px;font-weight:700;line-height:1.1;margin-top:6px}
.stat-v span{font-size:16px;color:var(--muted);font-weight:500}

/* goals */
.field{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--soft);outline:none;resize:vertical}
.field:focus{border-color:var(--purple);background:#fff;box-shadow:0 0 0 3px var(--tint)}
.field.big{font-size:17px;font-family:'Space Grotesk',Inter,sans-serif;font-weight:500}
.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;border-right:1px solid var(--line);background:#fff;padding:11px 8px;font-weight:500;font-size:14px;min-height:44px}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--soft)}
.seg button.on{background:var(--purple);color:#fff;font-weight:600}
.seg button.on.done{background:var(--green)}
.wgoal{border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;background:#fff}
.wgoal.done{background:var(--green-tint);border-color:#BFE0CF}
.wgoal-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.row{display:flex;gap:12px;align-items:center}
.goal-input{flex:1;border:0;border-bottom:1px solid var(--line);background:transparent;font-size:16px;padding:8px 0;outline:none;min-width:0}
.goal-input:focus{border-bottom-color:var(--purple)}
.check{width:44px;height:44px;border-radius:50%;border:2px solid #CDBFDB;background:#fff;display:grid;place-items:center;flex-shrink:0}
.check:hover{border-color:var(--green)}
.check.on{background:var(--green);border-color:var(--green)}
.link-toggle{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 11px;font-size:12px;font-weight:600;color:var(--muted);display:inline-flex;gap:6px;align-items:center;min-height:30px}
.link-toggle.on{border-color:var(--purple);background:var(--tint);color:var(--purple)}
.month-text{font-family:'Space Grotesk',Inter,sans-serif;font-size:19px;font-weight:600;line-height:1.35}
.quote{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:16px 18px;font-size:15.5px;white-space:pre-line;position:relative}
.progress-dots{display:flex;gap:5px}
.progress-dots span{width:24px;height:7px;border-radius:4px;background:#E2D8EA}
.progress-dots span.on{background:var(--green)}
.hero .progress-dots span{background:rgba(255,255,255,.25)} .hero .progress-dots span.on{background:var(--gold)}

/* WOOP */
.woop{border:1px solid #E9D9B8;background:var(--gold-tint);border-radius:14px;padding:18px 18px 16px;margin-top:16px}
.woop-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.woop-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.woop-step{display:flex;flex-direction:column;gap:6px}
.woop-step label,.woop-step .wl{font-size:13px;font-weight:600;display:flex;gap:8px;align-items:center}
.woop-l{width:24px;height:24px;border-radius:50%;background:var(--purple);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;flex-shrink:0}
.woop .field{background:#fff;font-size:14px;padding:10px 12px}
.woop-wish{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;min-height:44px}
.plan-row{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center}
.plan-row span{font-size:13px;font-weight:700;color:var(--purple);width:40px}
.woop-view{display:grid;gap:10px}
.woop-view .woop-step{flex-direction:row;align-items:flex-start;gap:10px}
.woop-view p{margin:0;font-size:14.5px}
@media (max-width:640px){.woop-grid{grid-template-columns:1fr}}

/* bars */
.bar-row{display:flex;flex-direction:column;gap:6px}
.bar-top{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.bar{height:8px;border-radius:4px;background:var(--track);overflow:hidden}
.bar>span{display:block;height:100%;border-radius:4px;background:var(--purple)}
.weeks{display:flex;gap:14px;align-items:flex-end;height:140px}
.wk{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;justify-content:flex-end;height:100%}
.wk-bar{width:100%;max-width:44px;border-radius:10px 10px 4px 4px;background:#D5C3E5}
.wk-bar.now{background:var(--purple)}

/* people */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.person{border:1px solid var(--line);background:#fff;border-radius:var(--r-sharp);padding:20px;display:flex;flex-direction:column;gap:14px;text-align:left;box-shadow:0 1px 2px rgba(42,16,64,.04),0 10px 26px rgba(42,16,64,.05);transition:transform .15s,box-shadow .15s,border-color .15s}
.person:hover{border-color:#C7B6D6;transform:translateY(-2px);box-shadow:0 16px 36px rgba(42,16,64,.1)}
.person-monthly{font-size:14px;color:#3A3342;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.author{display:flex;gap:12px;align-items:center}
.open-link{font-weight:600;color:var(--purple);font-size:14px;margin-top:auto;padding-top:10px;border-top:1px solid var(--line)}
.h-dept{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:21px}

/* AI card */
.ai-card{background:var(--deep);color:#fff;border-radius:var(--r-sharp);padding:28px;box-shadow:0 18px 40px rgba(42,16,64,.22);position:relative;overflow:hidden}
.ai-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.ai-badge{display:inline-flex;align-items:center;gap:7px;background:var(--gold);color:var(--ink);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:5px 11px;border-radius:999px}
.ai-head h2{font-size:24px;margin-top:10px;color:#fff}
.ai-meta{font-size:13px;color:#CDB8E0}
.ai-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
.ai-block{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:18px 20px}
.ai-block h3{font-size:15px;font-weight:600;color:var(--gold);letter-spacing:.02em;margin-bottom:10px;text-transform:uppercase;font-family:Inter,sans-serif}
.ai-block ul,.ai-block ol{margin:0;padding-left:20px}
.ai-block li{margin:7px 0;color:#F1EAF7}
.ai-sub{font-size:13px;color:#CDB8E0;margin:-4px 0 12px}
.needs{display:grid;gap:10px}
.need{display:grid;grid-template-columns:110px auto 1fr;gap:12px;align-items:center;padding:10px 12px;background:rgba(255,255,255,.04);border-radius:10px}
.need b{font-size:14px}
.need .ev{font-size:13px;color:#DCCBEB}
.lvl{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:999px;white-space:nowrap}
.lvl.strong{background:#2F9A72;color:#fff}.lvl.mixed{background:var(--gold);color:var(--ink)}.lvl.risk{background:#E07155;color:#fff}.lvl.none{background:rgba(255,255,255,.15);color:#fff}
.ai-card .bar{background:rgba(255,255,255,.12)}
.ai-card .bar>span{background:var(--gold)}
.ai-card .bar-top{color:#F1EAF7}
.ci{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid rgba(255,255,255,.08)}
.ci:first-child{border-top:0;padding-top:0}
.ci .who{font-weight:600}
.ci .why{font-size:13px;color:#DCCBEB}
.ai-foot{font-size:12.5px;color:#B7A2CB;margin-top:6px}

/* feed & posts */
.ev-row{display:flex;gap:14px;align-items:center;padding:16px 20px}
.ev-row+.ev-row{border-top:1px solid var(--line)}
.ev-txt{flex:1;min-width:0}
.bravo{border:1.5px solid var(--purple);background:#fff;color:var(--purple);border-radius:999px;padding:0 16px;height:42px;font-weight:700;display:inline-flex;align-items:center;gap:7px;flex-shrink:0}
.bravo:hover{background:var(--tint)}
.sent{height:42px;padding:0 16px;border-radius:999px;background:var(--green);color:#fff;font-weight:600;display:inline-flex;align-items:center;gap:6px;font-size:14px;flex-shrink:0}
.post{padding:0;overflow:hidden}
.post-body{padding:24px;display:flex;flex-direction:column;gap:12px}
.ceo-strip{background:var(--deep);color:#fff;padding:11px 24px;font-weight:600;display:flex;justify-content:space-between;align-items:center;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.ceo-strip span:first-child{color:var(--gold)}
.post h3{font-size:22px}
.sec h4{font-size:15px;margin-bottom:4px;color:var(--purple)}
.sec p{margin:0;white-space:pre-line;color:#332D3B}
.post-foot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);padding:12px 24px;background:var(--soft)}
.status{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:#EEEAF1;color:var(--muted)}
.status.pub{background:var(--green-tint);color:var(--green)}

.post-text p{margin:0 0 12px;color:#332D3B;line-height:1.65;font-size:15.5px}
.post-text p:last-child{margin-bottom:0}

/* panels, modal, toast */
.panel{position:absolute;right:24px;top:70px;width:390px;max-width:calc(100vw - 24px);max-height:calc(100vh - 90px);overflow:auto;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:18px;box-shadow:0 22px 60px rgba(23,19,29,.22);z-index:30}
.panel-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff}
.n-group{padding:12px 18px 4px}
.n-item{display:flex;gap:12px;align-items:flex-start;padding:12px 18px;width:100%;text-align:left;background:#fff;border-top:1px solid #F1ECF5;cursor:pointer}
.n-item.unread{background:#F7F1FB}
.n-item:hover{background:#F4EEF9}
.n-ico{width:38px;height:38px;border-radius:50%;background:var(--purple);display:grid;place-items:center;flex-shrink:0}
.menu{width:310px}
.menu-sec{padding:14px 18px;border-top:1px solid var(--line)}
.role-opt{display:flex;align-items:center;gap:12px;width:100%;padding:10px;border:1px solid transparent;border-radius:12px;background:none;text-align:left;min-height:52px}
.role-opt:hover{background:var(--soft)}
.role-opt.on{border-color:var(--purple);background:var(--tint)}
.backdrop{position:fixed;inset:0;background:rgba(23,19,29,.45);z-index:40;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
.modal{background:#fff;border-radius:22px;width:100%;max-width:740px;padding:28px;display:flex;flex-direction:column;gap:18px}
.modal-head{display:flex;justify-content:space-between;align-items:center}
.info-box{display:flex;gap:10px;background:var(--tint);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--deep)}
.av-grid{display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;align-items:start}
.opt-row{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 12px;font-size:14px;min-height:38px}
.opt.on{border-color:var(--purple);background:var(--tint);color:var(--purple);font-weight:600}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.sw.on{box-shadow:0 0 0 3px var(--purple)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:60;display:flex;gap:10px;align-items:center;max-width:calc(100vw - 32px)}
.toast[hidden]{display:none}

@media (max-width:960px){ .stats{grid-template-columns:repeat(2,minmax(0,1fr))} .ai-grid{grid-template-columns:1fr} }
@media (max-width:860px){
  .grid2,.grid3,.grid2even{grid-template-columns:1fr}
  .tabs{position:fixed;bottom:0;left:0;right:0;height:auto;margin:0;background:var(--deep);border-top:1px solid rgba(255,255,255,.12);padding:0 0 env(safe-area-inset-bottom);z-index:25}
  .tab{flex:1;padding:16px 4px;font-size:13px}
  .tab.on::after{top:0;bottom:auto}
  .demo-pill{display:none}
  .hbtn span{display:none}
  .page-head h1{font-size:27px}
  .av-grid{grid-template-columns:1fr}
  .need{grid-template-columns:1fr auto}
  .need .ev{grid-column:1/-1}
  .seg{grid-template-columns:repeat(2,minmax(0,1fr))}
  .seg button:nth-child(2){border-right:0}
  .seg button:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .toast{bottom:84px}
}

2,2,2],"thea":[2,0,0,2],"henrik":[1,0,1,1],"aisha":[1,1,0,0],"ola":[1,2,0,1],"mia":[1,0,0,1],"jakob":[2,0,0,2],"emma":[2,0,1,2],"viktor":[0,0,1,1],"sara":[0,1,2,2],"eline":[0,1,1,1],"magnus":[1,1,0,1],"nina":[0,1,1,2],"peter":[2,2,2,0]},"feed":[{"id":"8yydijub","userId":"silje","kind":"weekly","goal":2,"ts":1795607565344,"bravoFrom":[]},{"id":"st4aiun5","userId":"kari","kind":"weekly","goal":1,"ts":1795546365344,"bravoFrom":["jonas","ingrid"]},{"id":"tl42pwrv","userId":"ingrid","kind":"weekly","goal":2,"ts":1795539165344,"bravoFrom":["ahmed"]},{"id":"kjy4cl7a","userId":"jonas","kind":"weekly","goal":1,"ts":1795452765344,"bravoFrom":["kari","marte"]},{"id":"ypxmwian","userId":"ahmed","kind":"monthly","goal":0,"ts":1795510365344,"bravoFrom":["kari","marte","jonas"]},{"id":"lv7ijx5a","userId":"lise","kind":"weekly","goal":1,"ts":1795600365344,"bravoFrom":["omar"]},{"id":"rqbi2kvz","userId":"thea","kind":"weekly","goal":2,"ts":1795510365344,"bravoFrom":[]},{"id":"b0g6tfxc","userId":"mia","kind":"monthly","goal":0,"ts":1795589565344,"bravoFrom":["ola","sara"]},{"id":"j86vqimi","userId":"viktor","kind":"weekly","goal":1,"ts":1795521165344,"bravoFrom":["emma"]},{"id":"t2i0tqsh","userId":"nina","kind":"weekly","goal":1,"ts":1795596765344,"bravoFrom":["eline"]},{"id":"oit8mhmp","userId":"peter","kind":"weekly","goal":1,"ts":1795513965344,"bravoFrom":[]}],"posts":[{"id":"p-product","type":"dept","dept":"product","authorId":"martin","month":"November 2026","status":"published","ts":1795359165344,"title":"Turning customer insights into meaningful improvements","body":"This month, much of our work has been focused on understanding how we can make the onboarding experience easier for our customers.\nAcross the team, colleagues have contributed by gathering customer feedback, exploring new ideas, challenging existing assumptions and helping us narrow down our priorities. These contributions have helped us develop a clearer understanding of what our customers actually need.\nWorking closely with Design has allowed us to translate these insights into more tangible solutions, while input from Engineering has helped us understand what is technically feasible and where we need to rethink our approach.\nOne of our main learnings this month has been that progress sometimes comes from stepping back and asking better questions, rather than immediately moving forward with a solution.\nThank you to everyone who has contributed with their curiosity, perspectives and willingness to help. We are entering December with a clearer direction and a better understanding of what we want to achieve together.","bravos":["kari","hanne"]},{"id":"p-design","type":"dept","dept":"design","authorId":"nora","month":"November 2026","status":"published","ts":1795341885344,"title":"Making the complex a little simpler","body":"Throughout November, we have been exploring how to make our product more intuitive, accessible and welcoming to new customers.\nMembers of the team have contributed through user testing, prototyping, sharing feedback and refining existing designs. Some of the most valuable contributions have come from small observations and conversations that challenged how we initially approached a problem.\nThe insights shared by Product have given us a better understanding of the customer journey, while our collaboration with Engineering has helped us turn ideas into solutions that can work in practice.\nNot every design we explored turned out as expected, but these experiences have helped us understand our users better and make more informed decisions moving forward.\nWhat stands out this month is how much our work has benefited from different perspectives, both within and outside the department. The experience we create for our customers is not the result of design alone, but of many people bringing their knowledge together.","bravos":["martin"]},{"id":"p-eng","type":"dept","dept":"engineering","authorId":"erik","month":"November 2026","status":"published","ts":1795324605344,"title":"Building a stronger foundation for what comes next","body":"November has been a month of both development and improvement. Alongside building functionality for the new onboarding experience, we have spent time improving the underlying systems that make our product more reliable and easier to develop.\nThroughout the month, colleagues have contributed by solving technical challenges, reviewing each other's work, sharing knowledge, documenting solutions and helping one another when unexpected issues arose.\nMuch of this work may not be immediately visible to the rest of the organization, but it creates the foundation for many of the improvements we are working towards together.\nOur collaboration with Product and Design has also helped us better understand the purpose behind the features we develop. Being involved in these conversations early has allowed us to explore alternative solutions and identify potential challenges together.\nWe have learned a lot from both the things that worked and the things that required us to change direction. Thank you to everyone who has made time to support colleagues and share what they know.","bravos":["hanne","nora"]},{"id":"p-people","type":"dept","dept":"people","authorId":"camilla","month":"November 2026","status":"published","ts":1795307325344,"title":"Creating better conditions for people to do their work","body":"This month, we have been working on how we can better support our colleagues in their everyday work as the organization continues to grow.\nMembers of our team have contributed by listening to employees across departments, gathering feedback on internal processes and exploring ways to improve knowledge sharing, collaboration and employee onboarding.\nThrough conversations with Product, Design and Engineering, we have gained a better understanding of the different challenges people experience in their work. This has helped us identify opportunities to simplify internal processes, create clearer expectations and make it easier for colleagues to access the support they need.\nAn important learning this month has been that improving the employee experience is not something People & Culture can do in isolation. It depends on people across the organization being willing to share their experiences, raise concerns and contribute their perspectives.\nThank you to everyone who has taken the time to share their thoughts with us. These conversations help us create a workplace where people have better opportunities to learn, develop and contribute in ways that are meaningful to them.","bravos":["erik"]},{"id":"p-ceo","type":"ceo","dept":null,"authorId":"hanne","month":"November 2026","status":"published","ts":1795445565344,"title":"Different contributions, shared momentum","body":"Looking back at November, what stands out to me is not just what we have achieved, but how the work taking place across our organization is coming together.\nOur Product team has helped us better understand the needs of our customers and given us a clearer direction. Design has built on these insights to create a more intuitive and welcoming customer experience. Engineering has been turning these ideas into reality while strengthening the technical foundation that allows us to continue developing our product. At the same time, People & Culture has been working to create better conditions for us all to collaborate, learn and do meaningful work.\nThese are not four separate stories. They are different parts of the same story.\nThe insights gathered in one department inform decisions in another. The challenges solved by one colleague create opportunities for someone else. The time spent sharing knowledge, offering feedback or helping a colleague may seem like a small part of our working day, but these contributions are an important part of how we move forward as an organization.\nProgress is also about more than the things we complete. It is found in the questions we ask, the mistakes we learn from, the ideas we explore and the ways we support one another along the way. Not everything goes according to plan, and there is value in what we learn when it does not.\nI hope that reading about the work taking place across our departments helps you see how your own contributions fit into the bigger picture. Regardless of where you work in the organization, you are part of something we are building together.\nThank you for what you have brought to our organization this month, whether through your everyday work, your ideas, your willingness to learn or the support you have offered to others.\nOur momentum is something we create together.","bravos":["martin","nora","jonas"]}],"notifications":{"kari":[{"id":"hpw5wn0m","type":"bravo","ts":1795549965344,"read":false,"from":"jonas","kind":"weekly","goal":1},{"id":"v0ppq0od","type":"achieved","ts":1795539165344,"read":false,"from":"ingrid","eventId":"tl42pwrv","kind":"weekly","goal":2},{"id":"r2w54jim","type":"ceo","ts":1795445565344,"read":false,"postId":"p-ceo"},{"id":"xvp1bcap","type":"post","ts":1795359165344,"read":true,"postId":"p-product"},{"id":"oy3cr2lc","type":"reminder","ts":1795438365344,"read":true,"text":"Set your two weekly goals"}],"martin":[{"id":"z80hfg1k","type":"reminder","ts":1795611165344,"read":false,"text":"Your weekly team summary is ready"},{"id":"el3502wi","type":"achieved","ts":1795546365344,"read":false,"from":"kari","eventId":"st4aiun5","kind":"weekly","goal":1},{"id":"8iyqchvk","type":"ceo","ts":1795445565344,"read":false,"postId":"p-ceo"},{"id":"nd553suz","type":"achieved","ts":1795510365344,"read":true,"from":"ahmed","eventId":"ypxmwian","kind":"monthly","goal":0}],"hanne":[{"id":"6kh63ovm","type":"reminder","ts":1795603965344,"read":false,"text":"Your weekly organization summary is ready"},{"id":"q5kd738r","type":"post","ts":1795308765344,"read":true,"postId":"p-people"},{"id":"utzql70r","type":"post","ts":1795323165344,"read":true,"postId":"p-eng"}],"jonas":[],"ingrid":[],"sindre":[],"marte":[],"ahmed":[],"silje":[],"lise":[],"omar":[],"thea":[],"henrik":[],"aisha":[],"ola":[],"mia":[],"jakob":[],"emma":[],"viktor":[],"sara":[],"eline":[],"magnus":[],"nina":[],"peter":[],"nora":[],"erik":[],"camilla":[]},"notes":{"martin":{},"hanne":{}},"simIdx":0,"textOverrides":{},"info":[{"title":"Why momentum?","body":"Motivation lasts longest when people choose their own goals, feel that they are growing, and feel connected to the colleagues around them. Momentum makes that visible week by week. You set goals you care about, take small steps that give a real sense of progress, and colleagues cheer each other on along the way. Success here means learning and your own progress – not beating anyone."},{"title":"How to use it","body":"Monday: set two small weekly goals. At the start of the month: choose one thing you want to learn or get better at, and think it through with a short WOOP plan. Tick off a goal when it feels done – there is no score. Friday: write a few lines about how the week went. When a colleague reaches a goal, you can send a Bravo! if you want to."},{"title":"Privacy – who sees what","body":"You and your leader can see your goals, your WOOP plan and your reflection. Colleagues only see that you reached “Weekly goal 1–2” or “your monthly goal” – never what the goal was. Leaders use this to support you and remove obstacles, never for appraisal, pay or comparison. There are no rankings anywhere in Momentum."},{"title":"Tips for good goals","body":"Monthly: pick something you want to learn or get better at, and that matters to you. Weekly: pick one concrete action you control and can finish within the week. Leave out numbers and targets – realistic beats impressive. In your WOOP, name an obstacle inside yourself, like a habit or a feeling, and decide what you will do when it shows up."},{"title":"FAQ","body":"What if I don’t reach a goal? Nothing happens – it’s useful information for your Friday reflection. Can I set weekly goals that aren’t about my monthly goal? Yes, that’s up to you. Is a Bravo! required? No, it’s always voluntary. Can my leader see my goals? Yes – so they can support you, not to judge you."}],"savedAt":1795680468377}</script>

<script>
/* ============ constants ============ */
const DEPTS=[{id:'product',name:'Product',leader:'martin'},{id:'design',name:'Design',leader:'nora'},{id:'engineering',name:'Engineering',leader:'erik'},{id:'people',name:'People & Culture',leader:'camilla'}];
const ROLE_USER={employee:'kari',leader:'martin',ceo:'hanne'};
const ROLE_LABEL={employee:'Employee',leader:'Leader',ceo:'CEO'};
const STATUS=['Just started','Making progress','Almost there','Achieved'];
const AV={
  bg:['#4E2272','#EFE8F5','#F4C95D','#9BC1BC','#E07A5F','#3D5A80','#F2CC8F','#81B29A'],
  skin:['#FFDBB4','#EDB98A','#D08B5B','#AE5D29','#614335'],
  hairColor:['#2C1B18','#724133','#B58143','#D6B370','#A55728','#E8E1E1'],
  shirt:['#4E2272','#E07A5F','#3D5A80','#81B29A','#2B2D31','#F4C95D'],
  hair:['none','short','long','bun','curly'],eyes:['dots','happy','wink'],mouth:['smile','grin','neutral'],acc:['none','glasses','sunglasses','cap']
};
const LIGHT_BG=['#EFE8F5','#F4C95D','#9BC1BC','#F2CC8F','#81B29A'];
const STORE_KEY='momentum-demo-v2';
const DAY=864e5, HOUR=36e5;

/* Reflection coding: self-determination theory needs + common obstacles */
const CODES=[
  {id:'autonomy',label:'Autonomy',need:true,pos:['my own way','own way','freedom','trusted','got to decide','got to plan','independently','free to'],neg:['more say','no say','micromanag','told exactly','not allowed','controlled','decided for me','no control']},
  {id:'competence',label:'Competence',need:true,pos:['learned','learnt','better than expected','more confident','figured out','improved','got better','mastered','taught','proud'],neg:['unsure','stuck','don’t know',"don't know",'struggl','not good enough','overwhelmed','lost']},
  {id:'relatedness',label:'Relatedness',need:true,pos:['helped','support','together','collaboration','feedback','closely with','worked well','team spirit','thanks'],neg:['alone','isolated','nobody','no one','conflict','left out','lonely']},
  {id:'workload',label:'Workload & meetings',neg:['meetings','busy','overtime','too much','deadline','long days','no time']},
  {id:'priorities',label:'Unclear priorities',neg:['unclear','priorit','changing','changes in the plan','what was most important','confus']},
  {id:'waiting',label:'Waiting on others',neg:['waiting','waited','blocked','delayed','depend']},
  {id:'tools',label:'Tools & resources',neg:['missing tools','tools','equipment','software','access','is slow']},
  {id:'energy',label:'Energy & wellbeing',neg:['tired','stress','exhausted','drained','long days','overtime','burn']}
];
const NEED_TXT={autonomy:{pos:'Feels trusted',neg:'Wants more say'},competence:{pos:'Learning & growing',neg:'Feels stuck'},relatedness:{pos:'Good support',neg:'Feels alone'}};
const NEED_EV={autonomy:['feel trusted to decide how they work','want more say in how work is done'],competence:['describe learning or growing','feel stuck or unsure'],relatedness:['mention good support from colleagues','feel alone or isolated']};
const ACTIONS={
  autonomy:'Give more say in how work is planned – agree on the goal, and let people choose the route.',
  competence:'Offer feedback, pairing or short training where people feel stuck. Celebrate learning, not just results.',
  relatedness:'Create space for collaboration – pair people on tasks and check in with those working alone.',
  workload:'Review recurring meetings and protect blocks of focus time.',
  priorities:'Start the week with a short priorities check-in so everyone knows what matters most.',
  waiting:'Map dependencies and agree on response times with the teams you depend on.',
  tools:'Follow up on missing tools, equipment or access – removing a blocker quickly signals that you care.',
  energy:'Talk about workload and recovery in 1:1s – sustained motivation needs energy.'
};

/* ============ helpers ============ */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y)/DAY+1)/7);}
const WEEK=isoWeek(new Date());
const monthLabel=(o=0)=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+o);return d.toLocaleString('en-GB',{month:'long',year:'numeric'});};
const MONTH=monthLabel(0).split(' ')[0];
function ago(ts){const s=(Date.now()-ts)/1000;if(s<60)return 'Just now';if(s<3600)return Math.floor(s/60)+' min ago';if(s<86400){const h=Math.floor(s/3600);return h+(h===1?' hour ago':' hours ago');}if(s<7*86400){const d=Math.floor(s/86400);return d===1?'Yesterday':d+' days ago';}return new Date(ts).toLocaleDateString('en-GB',{day:'numeric',month:'short'});}
function seeded(n){let x=Math.sin(n*9301+49297)*233280;return x-Math.floor(x);}
function randomAvatar(seed){const pick=(a,k)=>a[Math.floor(seeded(seed*7+k)*a.length)];return {style:'character',bg:pick(AV.bg,1),skin:pick(AV.skin,2),hair:pick(AV.hair.slice(1),3),hairColor:pick(AV.hairColor,4),eyes:pick(AV.eyes,5),mouth:pick(AV.mouth,6),acc:pick(AV.acc,7),shirt:pick(AV.shirt,8)};}
function codeText(text){
  const t=(text||'').toLowerCase(), out=[];
  if(!t.trim()) return out;
  CODES.forEach(c=>{
    const n=(c.neg||[]).filter(k=>t.includes(k)).length, p=(c.pos||[]).filter(k=>t.includes(k)).length;
    if(c.need){ if(n>p) out.push({id:c.id,sent:'neg'}); else if(p>0) out.push({id:c.id,sent:'pos'}); }
    else if(n>0) out.push({id:c.id,sent:'neg'});
  });
  return out;
}
const codeLabel=c=>{const def=CODES.find(x=>x.id===c.id);return def.need?NEED_TXT[c.id][c.sent]:def.label;};
const codeTag=c=>{const def=CODES.find(x=>x.id===c.id);return `<span class="tag ${def.need?(c.sent==='pos'?'pos':'neg'):'obs'}">${esc(codeLabel(c))}</span>`;};

/* ============ avatar svg ============ */
function avatarSVG(user, size=40){
  const a=user.avatar, name=esc(user.name);
  const st=`width="${size}" height="${size}" style="border-radius:50%;display:block;flex-shrink:0"`;
  if(a.style==='initials'){
    const ini=esc(user.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase());
    const fg=LIGHT_BG.includes(a.bg)?'#1B1D1F':'#FFFFFF';
    return `<svg viewBox="0 0 64 64" ${st} role="img" aria-label="${name}"><rect width="64" height="64" fill="${a.bg}"/><text x="32" y="40" text-anchor="middle" font-size="22" font-weight="600" font-family="Inter,sans-serif" fill="${fg}">${ini}</text></svg>`;
  }
  const hc=a.hairColor, D='#1B1D1F';
  let back='', front='';
  const top=`<path d="M19.5 27C19 15 26 12 32 12S45 15 44.5 27C42 21 37 18.5 32 18.5S22 21 19.5 27Z" fill="${hc}"/>`;
  if(a.hair==='short') front=top;
  if(a.hair==='long'){ back=`<path d="M18 30C18 13 46 13 46 30V52H40V32H24V52H18Z" fill="${hc}"/>`; front=top; }
  if(a.hair==='bun') front=top+`<circle cx="32" cy="11" r="5.5" fill="${hc}"/>`;
  if(a.hair==='curly') front=[[20,25],[22,19],[27,15],[32,13.5],[37,15],[42,19],[44,25]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="5" fill="${hc}"/>`).join('');
  let eyes='';
  if(a.eyes==='dots') eyes=`<circle cx="27.5" cy="29" r="1.7" fill="${D}"/><circle cx="36.5" cy="29" r="1.7" fill="${D}"/>`;
  if(a.eyes==='happy') eyes=`<path d="M25.5 29.6q2-2.4 4 0M34.5 29.6q2-2.4 4 0" stroke="${D}" stroke-width="1.6" fill="none" stroke-linecap="round"/>`;
  if(a.eyes==='wink') eyes=`<circle cx="27.5" cy="29" r="1.7" fill="${D}"/><path d="M34.5 29.6q2-2.4 4 0" stroke="${D}" stroke-width="1.6" fill="none" stroke-linecap="round"/>`;
  let mouth='';
  if(a.mouth==='smile') mouth=`<path d="M28 34.5q4 3.5 8 0" stroke="${D}" stroke-width="1.6" fill="none" stroke-linecap="round"/>`;
  if(a.mouth==='grin') mouth=`<path d="M27.5 34h9q-1 5-4.5 5t-4.5-5z" fill="#fff" stroke="${D}" stroke-width="1.3" stroke-linejoin="round"/>`;
  if(a.mouth==='neutral') mouth=`<path d="M28.5 35.5h7" stroke="${D}" stroke-width="1.6" stroke-linecap="round"/>`;
  let acc='';
  if(a.acc==='glasses') acc=`<g fill="none" stroke="${D}" stroke-width="1.4"><circle cx="27.5" cy="29" r="3.6"/><circle cx="36.5" cy="29" r="3.6"/><path d="M31.1 29h1.8"/></g>`;
  if(a.acc==='sunglasses') acc=`<g fill="${D}"><rect x="23" y="26.5" width="8.5" height="5.5" rx="2"/><rect x="32.5" y="26.5" width="8.5" height="5.5" rx="2"/><rect x="30" y="27.6" width="4" height="1.2"/></g>`;
  if(a.acc==='cap') acc=`<path d="M19 24C19 12.5 45 12.5 45 24Z" fill="#2B2D31"/><path d="M30 23.2H50Q52.5 23.6 50 26.4H30Z" fill="#2B2D31"/>`;
  return `<svg viewBox="0 0 64 64" ${st} role="img" aria-label="${name}"><rect width="64" height="64" fill="${a.bg}"/><path d="M10 66C10 52 20 46 32 46S54 52 54 66Z" fill="${a.shirt}"/>${back}<rect x="28" y="37" width="8" height="10" fill="${a.skin}"/><ellipse cx="32" cy="29" rx="12.5" ry="14" fill="${a.skin}"/>${front}${eyes}${mouth}${acc}</svg>`;
}

/* ============ icons ============ */
const I = {
  bell:(c='currentColor',s=20)=>`<svg aria-hidden="true" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>`,
  lock:(s=14)=>`<svg aria-hidden="true" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>`,
  eye:(s=14)=>`<svg aria-hidden="true" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>`,
  eyeOff:(s=14)=>`<svg aria-hidden="true" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9.9 4.2A10 10 0 0 1 12 4c6.5 0 10 8 10 8a17 17 0 0 1-2.2 3.2M6.6 6.6C3.7 8.6 2 12 2 12s3.5 8 10 8a9.7 9.7 0 0 0 5.4-1.6"/><path d="M2 2l20 20"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>`,
  check:(c='#fff',s=20)=>`<svg aria-hidden="true" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>`,
  x:(s=20)=>`<svg aria-hidden="true" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>`,
  info:(s=18)=>`<svg aria-hidden="true" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>`,
  pen:(s=16)=>`<svg aria-hidden="true" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>`,
  cal:(s=18)=>`<svg aria-hidden="true" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>`,
  doc:(s=18)=>`<svg aria-hidden="true" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></svg>`,

/* ============ analysis for AI summary ============ */
function analyse(people){
  const r={size:people.length,monthlySet:0,status:{},weeklyPeople:0,weeklyGoals:0,weeklyDone:0,linked:0,reflected:0,lastWeek:0,woop:0,noWoop:[],
    needs:{autonomy:{pos:[],neg:[]},competence:{pos:[],neg:[]},relatedness:{pos:[],neg:[]}},obstacles:{},noGoals:[],codes:{}};
  people.forEach(p=>{
    const g=state.goals[p.id]; if(!g) return;
    if(g.monthly.text.trim()){r.monthlySet++; r.status[g.monthly.status]=(r.status[g.monthly.status]||0)+1; if(woopDone(g)) r.woop++; else r.noWoop.push(p);}
    const ws=g.weekly.filter(w=>w.text.trim());
    if(ws.length) r.weeklyPeople++; else if(!g.monthly.text.trim()) r.noGoals.push(p);
    r.weeklyGoals+=ws.length; r.weeklyDone+=ws.filter(w=>w.done).length; r.linked+=ws.filter(w=>w.linked).length;
    r.lastWeek+=(state.history[p.id]||[]).slice(-1)[0]||0;
    const rf=state.reflections[p.id];
    if(rf&&rf.saved&&rf.text.trim()){
      r.reflected++;
      const cs=codeText(rf.text); r.codes[p.id]=cs;
      cs.forEach(c=>{ if(r.needs[c.id]) r.needs[c.id][c.sent].push(p); else (r.obstacles[c.id]=r.obstacles[c.id]||[]).push(p); });
    }
  });
  return r;
}
function needLevel(n){ if(!n.pos.length&&!n.neg.length) return ['none','No signals']; if(n.neg.length>n.pos.length) return ['risk','At risk']; if(n.neg.length) return ['mixed','Mixed']; return ['strong','Strong']; }
function aiCard(scope,people,title){
  const a=analyse(people), unit=scope==='org'?'people across the organization':'people in the team';
  const st=STATUS.filter(s=>a.status[s]).map(s=>`${a.status[s]} ${s.toLowerCase()}`).join(', ');
  const ov=[];
  ov.push(`${a.monthlySet} of ${a.size} ${unit} have set a monthly goal for ${MONTH}${st?` – ${st}`:''}.`);
  ov.push(`${a.woop} of ${a.monthlySet} have completed a WOOP reflection on their monthly goal (outcome, inner obstacle and an if–then plan)${a.woop<a.monthlySet?' – encourage the rest: naming the inner obstacle and a plan makes goals more likely to be reached':''}.`);
  ov.push(`${a.weeklyDone} of ${a.weeklyGoals} weekly goals are achieved so far this week (last week: ${a.lastWeek}).`);
  if(a.weeklyGoals){ const pct=a.linked/a.weeklyGoals;
    ov.push(pct>=.5?'Most weekly goals are steps toward a monthly goal.'
      :'Fewer weekly goals link to a monthly goal this week – worth asking in 1:1s whether the monthly goal still feels meaningful and within reach.'); }
  ov.push(`${a.reflected} of ${a.size} wrote a Friday reflection. Motivation signals and obstacles below are coded from their text.`);
  const needs=['autonomy','competence','relatedness'].map(k=>{const n=a.needs[k],[cls,lab]=needLevel(n);
    const ev=[n.pos.length?`${n.pos.length} ${NEED_EV[k][0]}`:'',n.neg.length?`${n.neg.length} ${NEED_EV[k][1]}`:''].filter(Boolean).join(' · ')||'Not mentioned this week';
    return `<div class="need"><b>${CODES.find(c=>c.id===k).label}</b><span class="lvl ${cls}">${lab}</span><span class="ev">${esc(ev)}</span></div>`;}).join('');
  const obs=Object.entries(a.obstacles).sort((x,y)=>y[1].length-x[1].length);
  const maxO=Math.max(1,...obs.map(o=>o[1].length));
  const obsHtml=obs.length?`<div class="stack" style="gap:12px">${obs.slice(0,5).map(([id,ps])=>`<div class="bar-row"><div class="bar-top"><span>${esc(CODES.find(c=>c.id===id).label)}</span><b>${ps.length} ${ps.length===1?'person':'people'}</b></div><div class="bar"><span style="width:${Math.round(ps.length/maxO*100)}%"></span></div></div>`).join('')}</div>`:'<div class="ai-sub">No obstacles mentioned this week.</div>';
  let side='';
  if(scope==='team'){
    const flags=[];
    people.forEach(p=>{const why=[];const cs=a.codes[p.id]||[];
      if(a.noGoals.includes(p)) why.push('hasn’t set goals yet');
      cs.filter(c=>c.sent==='neg'&&NEED_TXT[c.id]).forEach(c=>why.push(NEED_TXT[c.id].neg.toLowerCase()));
      if(cs.some(c=>c.id==='energy')) why.push('signs of low energy or stress');
      if(why.length) flags.push(`<div class="ci">${avatarSVG(p,32)}<div><div class="who">${esc(p.name)}</div><div class="why">${esc(why.join(' · '))}</div></div></div>`);
    });
    side=`<div class="ai-block"><h3>Who might need a check-in</h3>${flags.length?flags.slice(0,5).join(''):'<div class="ai-sub">No one stands out this week.</div>'}</div>`;
  } else {
    side=`<div class="ai-block"><h3>Departments at a glance</h3>${DEPTS.map(d=>{const da=analyse(employeesOf(d.id));const o=Object.entries(da.obstacles).sort((x,y)=>y[1].length-x[1].length)[0];
      const weak=['autonomy','competence','relatedness'].map(k=>[k,needLevel(da.needs[k])]).filter(([k,l])=>l[0]==='risk'||l[0]==='mixed').map(([k])=>CODES.find(c=>c.id===k).label);
      return `<div class="ci"><div><div class="who">${d.name}</div><div class="why">${o?'Main obstacle: '+esc(CODES.find(c=>c.id===o[0]).label):'No obstacles mentioned'}${weak.length?' · Watch: '+esc(weak.join(', ')):''}</div></div></div>`;}).join('')}</div>`;
  }
  const acts=[];
  ['autonomy','competence','relatedness'].forEach(k=>{if(a.needs[k].neg.length) acts.push(ACTIONS[k]);});
  obs.slice(0,2).forEach(([id])=>acts.push(ACTIONS[id]));
  if(a.noGoals.length&&scope==='team') acts.push('Have a short, supportive chat with anyone who hasn’t set goals – ask what would make goal-setting useful for them.');
  if(!acts.length) acts.push('Keep doing what works – recognise effort and learning in your next team meeting.');
  return `<section class="ai-card" aria-labelledby="ai-h">
    <div class="ai-head"><div><span class="ai-badge">${I.spark(14,'#17131D')} AI summary</span><h2 id="ai-h">${esc(title)}</h2></div><div class="ai-meta">Week ${WEEK} · based on ${a.monthlySet} monthly goals, ${a.weeklyGoals} weekly goals and ${a.reflected} reflections</div></div>
    <div class="ai-grid">
      <div class="ai-block"><h3>Overview</h3><ul>${ov.map(l=>`<li>${esc(l)}</li>`).join('')}</ul></div>
      <div class="ai-block"><h3>Motivation signals</h3><p class="ai-sub">Basic psychological needs (self-determination theory), coded from reflections</p><div class="needs">${needs}</div></div>
    </div>
    <div class="ai-grid">
      <div class="ai-block"><h3>Key obstacles</h3>${obsHtml}</div>
      ${side}
    </div>
    <div class="ai-block" style="margin-bottom:14px"><h3>Suggested actions</h3><ol>${acts.slice(0,5).map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div>
    <div class="ai-foot">Prototype: reflections are coded with keyword rules and the summary is generated from that coding. A live version would use an AI model to read and code the text. The summary describes the team as a whole to help you support people – it does not rank or evaluate anyone.</div>
  </section>`;
}

const statTiles=items=>`<div class="stats">${items.map(([l,v,of,c])=>`<div class="stat ${c||''}"><div class="eyebrow">${l}</div><div class="stat-v">${v}${of!=null?`<span> / ${of}</span>`:''}</div></div>`).join('')}</div>`;

/* ============ text editing + download ============ */
function editableLeaves(){
  return [...document.querySelectorAll('#app h1,#app h2,#app h3,#app h4,#app p,#app span,#app div,#app label,#app b,#app li')].filter(el=>
    el.children.length===0&&el.textContent.trim()&&!el.closest('button,[role="button"],svg,textarea,.panel,.modal,.badge,.edit-bar'));
}
function applyText(){
  const o=state.textOverrides||{};
  editableLeaves().forEach(el=>{const orig=el.textContent;if(Object.prototype.hasOwnProperty.call(o,orig))el.textContent=o[orig];
    if(ui.editing){el.dataset.orig=orig;el.setAttribute('contenteditable','true');el.setAttribute('spellcheck','false');}});
}
document.addEventListener('focusout',e=>{
  const el=e.target;if(!el.dataset||el.dataset.orig===undefined||el.getAttribute('contenteditable')!=='true')return;
  const now=el.textContent;if(now===el.dataset.orig)return;
  if(now.trim()===''){delete state.textOverrides[el.dataset.orig];el.textContent=el.dataset.orig;}else state.textOverrides[el.dataset.orig]=now;
  save();
});
function downloadHTML(){
  save();
  const doc=document.documentElement.cloneNode(true);
  doc.querySelector('#app').innerHTML='';
  const t=doc.querySelector('#toast');t.hidden=true;t.innerHTML='';
  doc.querySelector('#saved-state').textContent=JSON.stringify(state).replace(/</g,'\\u003c');
  const html='<!DOCTYPE html>\n'+doc.outerHTML;
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download='momentum.html';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  toast('Downloaded momentum.html with your changes');
}

/* ============ actions ============ */
function achieve(u,kind,goal){
  const ev={id:uid(),userId:u.id,kind,goal,ts:Date.now(),bravoFrom:[]};state.feed.unshift(ev);
  audienceFor(u).forEach(x=>addNotif(x.id,{type:'achieved',from:u.id,eventId:ev.id,kind,goal}));
  toast('Nice step forward! Your team sees that you reached '+goalNameYou(kind,goal)+' – never what it was.');
  const mates=employeesOf(u.dept).filter(x=>x.id!==u.id), t=mates[Math.floor(Math.random()*mates.length)];
  if(t) setTimeout(()=>{const e=state.feed.find(x=>x.id===ev.id);if(!e||e.bravoFrom.includes(t.id))return;e.bravoFrom.push(t.id);addNotif(u.id,{type:'bravo',from:t.id,kind,goal});save();if(me().id===u.id)toast(t.name+' cheered you on with a Bravo!');render();},2800);
}
function unachieve(u,kind,goal){const k=state.feed.findIndex(e=>e.userId===u.id&&e.kind===kind&&e.goal===goal&&Date.now()-e.ts<7*DAY);if(k>-1)state.feed.splice(k,1);}

    if(old){p=old;Object.assign(p,{title:d.title,body:d.body,status:wasPub?'published':status});if(!wasPub&&status==='published')p.ts=Date.now();}
    else{p={id:uid(),type:d.type,dept:d.dept,authorId:u.id,month:d.month,title:d.title,body:d.body,status,ts:Date.now(),bravos:[]};state.posts.push(p);}
    if(p.status==='published'&&!wasPub){Object.keys(state.users).filter(id=>id!==u.id).forEach(id=>addNotif(id,{type:p.type==='ceo'?'ceo':'post',postId:p.id}));toast('Published – everyone has been notified');}
    else toast(p.status==='published'?'Changes saved':'Draft saved');
    ui.modal=null;},
  'avatar-edit':()=>{ui.panel=null;ui.modal={type:'avatar',draft:{...me().avatar}};},
  'av-set':(v,el)=>{ui.modal.draft[el.dataset.k]=v;},
  'av-random':()=>{ui.modal.draft=randomAvatar(Math.floor(Math.random()*1000)+1);},
  'av-save':()=>{me().avatar={...ui.modal.draft};ui.modal=null;toast('Avatar saved');},
  'modal-close':()=>{ui.modal=null;},
  backdrop:(v,el,e)=>{if(e.target===el)ui.modal=null;else return 'skip';},
  'notif-readall':()=>{(state.notifications[me().id]||[]).forEach(n=>n.read=true);},
  'notif-bravo':v=>{const n=state.notifications[me().id].find(x=>x.id===v);n.read=true;A.bravo(n.eventId);},
  'notif-open':v=>{const n=state.notifications[me().id].find(x=>x.id===v);n.read=true;ui.panel=null;
    if(n.type==='achieved')state.tab='team';else if(n.type==='post'||n.type==='ceo'){state.tab='monthly';ui.filter='all';ui.open[n.postId]=true;}else state.tab='dashboard';
    ui.person=null;ui.dept=null;window.scrollTo(0,0);},
  'info-edit':v=>{ui.infoEditing=+v;},
  'info-save':()=>{ui.infoEditing=null;toast('Saved');}
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');
  if(!el){if(ui.panel&&!e.target.closest('.panel')){ui.panel=null;render();}return;}
  if(ui.panel&&!el.closest('.panel')&&el.dataset.a!=='panel')ui.panel=null;
  const fn=A[el.dataset.a];if(!fn)return;
  const r=fn(el.dataset.v,el,e);if(r==='skip')return;
  save();render();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.getAttribute&&e.target.getAttribute('contenteditable')==='true'){e.preventDefault();e.target.blur();return;}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role="button"][data-a]')){e.preventDefault();e.target.click();}
  if(e.key==='Escape'&&(ui.modal||ui.panel)){ui.modal=null;ui.panel=null;render();}
});
document.addEventListener('input',e=>{
  const t=e.target,k=t.dataset&&t.dataset.in;if(!k)return;const u=me();
  if(k==='monthly'){state.goals[u.id].monthly.text=t.value;const wEl=document.querySelector('.woop-wish');if(wEl)wEl.textContent=t.value.trim()?t.value:'Write your monthly goal above';}
  if(k==='woop'){const m=state.goals[u.id].monthly;m.woop=m.woop||{outcome:'',obstacle:'',planIf:'',planThen:''};m.woop[t.dataset.v]=t.value;}
  if(k==='weekly')state.goals[u.id].weekly[+t.dataset.i].text=t.value;
  if(k==='refl'){const r=state.reflections[u.id]=state.reflections[u.id]||{text:'',saved:false};r.text=t.value;}
  if(k==='note')(state.notes[u.id]=state.notes[u.id]||{})[t.dataset.v]=t.value;
  if(k==='info')state.info[+t.dataset.v].body=t.value;
  if(k==='pd-title')ui.modal.draft.title=t.value;
  if(k==='pd-body')ui.modal.draft.body=t.value;
  save();
});
render();
</script>
