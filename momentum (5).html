<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>momentum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
:root{
  --purple:#4E2272;--deep:#2A1040;--ink:#17131D;--muted:#5F5769;--bg:#F5F3F7;--card:#FFFFFF;
  --line:#E2DAE9;--soft:#FAF8FC;--tint:#EFE7F6;--gold:#E8B14A;--gold-ink:#7A5208;--gold-tint:#FCF1DC;
  --green:#1E7F5C;--green-tint:#E2F2EA;--coral:#C2502E;--coral-tint:#FBE8E1;--track:#ECE6F1;
  --r-sharp:16px;--r-soft:10px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:'Space Grotesk',Inter,sans-serif;margin:0;letter-spacing:-.015em;line-height:1.2}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit;color:inherit}
a{color:var(--purple)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--deep);color:#fff}
.top-in{max-width:1160px;margin:0 auto;padding:0 24px;height:64px;display:flex;align-items:center;gap:20px;position:relative}
.brand{display:flex;align-items:center;gap:10px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:20px;letter-spacing:-.02em;white-space:nowrap}
.mark{width:32px;height:32px;border-radius:10px;background:var(--gold);display:grid;place-items:center}
.tabs{display:flex;gap:2px;height:100%;margin-left:12px}
.tab{border:0;background:none;padding:0 16px;font-weight:500;color:rgba(255,255,255,.72);height:100%;position:relative}
.tab:hover{color:#fff;background:rgba(255,255,255,.05)}
.tab.on{color:#fff;font-weight:600}
.tab.on::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--gold)}
.right{display:flex;align-items:center;gap:8px;margin-left:auto}
.demo-pill{font-size:12px;font-weight:600;color:var(--gold);border:1px solid rgba(232,177,74,.45);padding:4px 10px;border-radius:999px;white-space:nowrap}
.icon-btn{position:relative;width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:transparent;display:grid;place-items:center}
.icon-btn:hover{background:rgba(255,255,255,.08)}
.icon-btn.light{border-color:var(--line);background:#fff}
.badge{position:absolute;top:-6px;right:-6px;min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--gold);color:var(--ink);font-size:11px;font-weight:700;display:grid;place-items:center}
.av-btn{border:0;background:none;padding:0;border-radius:50%;display:block}

/* ---------- hero ---------- */
.hero{color:#fff;background:radial-gradient(circle at 92% -20%,rgba(255,255,255,.10) 0 260px,transparent 261px),radial-gradient(circle at 0% 140%,rgba(232,177,74,.16) 0 260px,transparent 261px),var(--purple);position:relative}
.hero-in{max-width:1160px;margin:0 auto;padding:36px 24px 92px}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap}
.page-head h1{font-size:34px;font-weight:700;color:#fff}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.hero .eyebrow{color:var(--gold)}
.hero .sub{color:#DCCBEB;margin-top:6px}
.hero .chips{margin-top:22px}
.hello{display:flex;align-items:center;gap:18px}
.hero-meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.hero-chip{font-size:13px;font-weight:500;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);padding:5px 11px;border-radius:999px;color:#fff}
.hero-chip b{color:var(--gold)}
.crumbs{display:flex;gap:8px;align-items:center;margin-bottom:16px;color:#CDB8E0;font-size:14px;flex-wrap:wrap}
.crumbs button{background:none;border:0;color:#fff;text-decoration:underline;text-underline-offset:3px;padding:6px 0;font-weight:500}

main{max-width:1160px;margin:-56px auto 0;padding:0 24px 110px;position:relative}

/* ---------- cards & basics ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-sharp);padding:24px;box-shadow:0 1px 2px rgba(42,16,64,.04),0 12px 32px rgba(42,16,64,.06)}
.card.accent{box-shadow:inset 0 4px 0 var(--gold),0 1px 2px rgba(42,16,64,.04),0 12px 32px rgba(42,16,64,.06)}
.card.accent-purple{box-shadow:inset 0 4px 0 var(--purple),0 1px 2px rgba(42,16,64,.04),0 12px 32px rgba(42,16,64,.06)}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.card-head h2{font-size:20px;margin-top:4px}
.muted{color:var(--muted)}
.small{font-size:13px}
.stack{display:flex;flex-direction:column;gap:14px}
.grid2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:start}
.grid2even{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:34px 0 14px}
.section-title h2{font-size:22px}

.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 16px;font-weight:600;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:14px}
.btn:hover{border-color:#C7B6D6;background:var(--soft)}
.btn.primary{background:var(--purple);border-color:var(--purple);color:#fff}
.btn.primary:hover{background:var(--deep)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.btn.gold:hover{background:#DDA23A}
.btn.ghost-light{background:transparent;border-color:rgba(255,255,255,.4);color:#fff}
.btn.ghost-light:hover{background:rgba(255,255,255,.08)}
.linkbtn{border:0;background:none;padding:6px 0;font-weight:600;color:var(--purple);min-height:36px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.fchip{border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;border-radius:999px;padding:7px 15px;font-weight:500;min-height:38px;font-size:14px}
.fchip.on{background:#fff;border-color:#fff;color:var(--purple);font-weight:600}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--tint);color:var(--purple);white-space:nowrap}
.tag.pos{background:var(--green-tint);color:var(--green)}
.tag.neg{background:var(--coral-tint);color:var(--coral)}
.tag.obs{background:var(--gold-tint);color:var(--gold-ink)}
.tag.grey{background:#EEEAF1;color:var(--muted)}
.note{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;color:var(--muted)}
.empty{border:1px dashed #D3C5E0;border-radius:12px;padding:16px;color:var(--muted);font-size:14px;background:var(--soft)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:20px}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r-sharp);padding:18px 20px;box-shadow:inset 0 4px 0 var(--purple),0 12px 32px rgba(42,16,64,.06)}
.stat.gold{box-shadow:inset 0 4px 0 var(--gold),0 12px 32px rgba(42,16,64,.06)} .stat.green{box-shadow:inset 0 4px 0 var(--green),0 12px 32px rgba(42,16,64,.06)} .stat.coral{box-shadow:inset 0 4px 0 var(--coral),0 12px 32px rgba(42,16,64,.06)}
.stat-v{font-family:'Space Grotesk',sans-serif;font-size:30px;font-weight:700;line-height:1.1;margin-top:6px}
.stat-v span{font-size:16px;color:var(--muted);font-weight:500}

/* goals */
.field{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--soft);outline:none;resize:vertical}
.field:focus{border-color:var(--purple);background:#fff;box-shadow:0 0 0 3px var(--tint)}
.field.big{font-size:17px;font-family:'Space Grotesk',Inter,sans-serif;font-weight:500}
.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;border-right:1px solid var(--line);background:#fff;padding:11px 8px;font-weight:500;font-size:14px;min-height:44px}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--soft)}
.seg button.on{background:var(--purple);color:#fff;font-weight:600}
.seg button.on.done{background:var(--green)}
.wgoal{border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;background:#fff}
.wgoal.done{background:var(--green-tint);border-color:#BFE0CF}
.wgoal-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.row{display:flex;gap:12px;align-items:center}
.goal-input{flex:1;border:0;border-bottom:1px solid var(--line);background:transparent;font-size:16px;padding:8px 0;outline:none;min-width:0}
.goal-input:focus{border-bottom-color:var(--purple)}
.check{width:44px;height:44px;border-radius:50%;border:2px solid #CDBFDB;background:#fff;display:grid;place-items:center;flex-shrink:0}
.check:hover{border-color:var(--green)}
.check.on{background:var(--green);border-color:var(--green)}
.link-toggle{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 11px;font-size:12px;font-weight:600;color:var(--muted);display:inline-flex;gap:6px;align-items:center;min-height:30px}
.link-toggle.on{border-color:var(--purple);background:var(--tint);color:var(--purple)}
.month-text{font-family:'Space Grotesk',Inter,sans-serif;font-size:19px;font-weight:600;line-height:1.35}
.quote{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:16px 18px;font-size:15.5px;white-space:pre-line;position:relative}
.progress-dots{display:flex;gap:5px}
.progress-dots span{width:24px;height:7px;border-radius:4px;background:#E2D8EA}
.progress-dots span.on{background:var(--green)}
.hero .progress-dots span{background:rgba(255,255,255,.25)} .hero .progress-dots span.on{background:var(--gold)}

/* WOOP */
.woop{border:1px solid #E9D9B8;background:var(--gold-tint);border-radius:14px;padding:18px 18px 16px;margin-top:16px}
.woop-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.woop-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.woop-step{display:flex;flex-direction:column;gap:6px}
.woop-step label,.woop-step .wl{font-size:13px;font-weight:600;display:flex;gap:8px;align-items:center}
.woop-l{width:24px;height:24px;border-radius:50%;background:var(--purple);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;flex-shrink:0}
.woop .field{background:#fff;font-size:14px;padding:10px 12px}
.woop-wish{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;min-height:44px}
.plan-row{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center}
.plan-row span{font-size:13px;font-weight:700;color:var(--purple);width:40px}
.woop-view{display:grid;gap:10px}
.woop-view .woop-step{flex-direction:row;align-items:flex-start;gap:10px}
.woop-view p{margin:0;font-size:14.5px}
@media (max-width:640px){.woop-grid{grid-template-columns:1fr}}

/* bars */
.bar-row{display:flex;flex-direction:column;gap:6px}
.bar-top{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.bar{height:8px;border-radius:4px;background:var(--track);overflow:hidden}
.bar>span{display:block;height:100%;border-radius:4px;background:var(--purple)}
.weeks{display:flex;gap:14px;align-items:flex-end;height:140px}
.wk{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;justify-content:flex-end;height:100%}
.wk-bar{width:100%;max-width:44px;border-radius:10px 10px 4px 4px;background:#D5C3E5}
.wk-bar.now{background:var(--purple)}

/* people */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.person{border:1px solid var(--line);background:#fff;border-radius:var(--r-sharp);padding:20px;display:flex;flex-direction:column;gap:14px;text-align:left;box-shadow:0 1px 2px rgba(42,16,64,.04),0 10px 26px rgba(42,16,64,.05);transition:transform .15s,box-shadow .15s,border-color .15s}
.person:hover{border-color:#C7B6D6;transform:translateY(-2px);box-shadow:0 16px 36px rgba(42,16,64,.1)}
.person-monthly{font-size:14px;color:#3A3342;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.author{display:flex;gap:12px;align-items:center}
.open-link{font-weight:600;color:var(--purple);font-size:14px;margin-top:auto;padding-top:10px;border-top:1px solid var(--line)}
.h-dept{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:21px}

/* AI card */
.ai-card{background:var(--deep);color:#fff;border-radius:var(--r-sharp);padding:28px;box-shadow:0 18px 40px rgba(42,16,64,.22);position:relative;overflow:hidden}
.ai-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.ai-badge{display:inline-flex;align-items:center;gap:7px;background:var(--gold);color:var(--ink);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:5px 11px;border-radius:999px}
.ai-head h2{font-size:24px;margin-top:10px;color:#fff}
.ai-meta{font-size:13px;color:#CDB8E0}
.ai-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
.ai-block{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:18px 20px}
.ai-block h3{font-size:15px;font-weight:600;color:var(--gold);letter-spacing:.02em;margin-bottom:10px;text-transform:uppercase;font-family:Inter,sans-serif}
.ai-block ul,.ai-block ol{margin:0;padding-left:20px}
.ai-block li{margin:7px 0;color:#F1EAF7}
.ai-sub{font-size:13px;color:#CDB8E0;margin:-4px 0 12px}
.needs{display:grid;gap:10px}
.need{display:grid;grid-template-columns:110px auto 1fr;gap:12px;align-items:center;padding:10px 12px;background:rgba(255,255,255,.04);border-radius:10px}
.need b{font-size:14px}
.need .ev{font-size:13px;color:#DCCBEB}
.lvl{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:999px;white-space:nowrap}
.lvl.strong{background:#2F9A72;color:#fff}.lvl.mixed{background:var(--gold);color:var(--ink)}.lvl.risk{background:#E07155;color:#fff}.lvl.none{background:rgba(255,255,255,.15);color:#fff}
.ai-card .bar{background:rgba(255,255,255,.12)}
.ai-card .bar>span{background:var(--gold)}
.ai-card .bar-top{color:#F1EAF7}
.ci{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid rgba(255,255,255,.08)}
.ci:first-child{border-top:0;padding-top:0}
.ci .who{font-weight:600}
.ci .why{font-size:13px;color:#DCCBEB}
.ai-foot{font-size:12.5px;color:#B7A2CB;margin-top:6px}

/* feed & posts */
.ev-row{display:flex;gap:14px;align-items:center;padding:16px 20px}
.ev-row+.ev-row{border-top:1px solid var(--line)}
.ev-txt{flex:1;min-width:0}
.bravo{border:1.5px solid var(--purple);background:#fff;color:var(--purple);border-radius:999px;padding:0 16px;height:42px;font-weight:700;display:inline-flex;align-items:center;gap:7px;flex-shrink:0}
.bravo:hover{background:var(--tint)}
.sent{height:42px;padding:0 16px;border-radius:999px;background:var(--green);color:#fff;font-weight:600;display:inline-flex;align-items:center;gap:6px;font-size:14px;flex-shrink:0}
.post{padding:0;overflow:hidden}
.post-body{padding:24px;display:flex;flex-direction:column;gap:12px}
.ceo-strip{background:var(--deep);color:#fff;padding:11px 24px;font-weight:600;display:flex;justify-content:space-between;align-items:center;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.ceo-strip span:first-child{color:var(--gold);display:inline-flex;align-items:center;gap:8px}
.post h3{font-size:22px}
.sec h4{font-size:15px;margin-bottom:4px;color:var(--purple)}
.sec p{margin:0;white-space:pre-line;color:#332D3B}
.post-foot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);padding:12px 24px;background:var(--soft)}
.status{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:#EEEAF1;color:var(--muted)}
.status.pub{background:var(--green-tint);color:var(--green)}

.post-text p{margin:0 0 12px;color:#332D3B;line-height:1.65;font-size:15.5px}
.post-text p:last-child{margin-bottom:0}

/* panels, modal, toast */
.panel{position:absolute;right:24px;top:70px;width:390px;max-width:calc(100vw - 24px);max-height:calc(100vh - 90px);overflow:auto;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:18px;box-shadow:0 22px 60px rgba(23,19,29,.22);z-index:30}
.panel-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff}
.n-group{padding:12px 18px 4px}
.n-item{display:flex;gap:12px;align-items:flex-start;padding:12px 18px;width:100%;text-align:left;background:#fff;border-top:1px solid #F1ECF5;cursor:pointer}
.n-item.unread{background:#F7F1FB}
.n-item:hover{background:#F4EEF9}
.n-ico{width:38px;height:38px;border-radius:50%;background:var(--purple);display:grid;place-items:center;flex-shrink:0}
.menu{width:310px}
.menu-sec{padding:14px 18px;border-top:1px solid var(--line)}
.role-opt{display:flex;align-items:center;gap:12px;width:100%;padding:10px;border:1px solid transparent;border-radius:12px;background:none;text-align:left;min-height:52px}
.role-opt:hover{background:var(--soft)}
.role-opt.on{border-color:var(--purple);background:var(--tint)}
.backdrop{position:fixed;inset:0;background:rgba(23,19,29,.45);z-index:40;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
.modal{background:#fff;border-radius:22px;width:100%;max-width:740px;padding:28px;display:flex;flex-direction:column;gap:18px}
.modal-head{display:flex;justify-content:space-between;align-items:center}
.info-box{display:flex;gap:10px;background:var(--tint);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--deep)}
.av-grid{display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;align-items:start}
.opt-row{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 12px;font-size:14px;min-height:38px}
.opt.on{border-color:var(--purple);background:var(--tint);color:var(--purple);font-weight:600}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.sw.on{box-shadow:0 0 0 3px var(--purple)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:60;display:flex;gap:10px;align-items:center;max-width:calc(100vw - 32px)}
.toast[hidden]{display:none}

@media (max-width:960px){ .stats{grid-template-columns:repeat(2,minmax(0,1fr))} .ai-grid{grid-template-columns:1fr} }
@media (max-width:860px){
  .grid2,.grid3,.grid2even{grid-template-columns:1fr}
  .tabs{position:fixed;bottom:0;left:0;right:0;height:auto;margin:0;background:var(--deep);border-top:1px solid rgba(255,255,255,.12);padding:0 0 env(safe-area-inset-bottom);z-index:25}
  .tab{flex:1;padding:16px 4px;font-size:13px}
  .tab.on::after{top:0;bottom:auto}
  .demo-pill{display:none}
  .page-head h1{font-size:27px}
  .av-grid{grid-template-columns:1fr}
  .need{grid-template-columns:1fr auto}
  .need .ev{grid-column:1/-1}
  .seg{grid-template-columns:repeat(2,minmax(0,1fr))}
  .seg button:nth-child(2){border-right:0}
  .seg button:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .toast{bottom:84px}
}

/* ---------- handbook book ---------- */

.pg-c.cover{padding:0;display:flex;flex-direction:column}

g closely with Design has allowed us to translate these insights into more tangible solutions, while input from Engineering has helped us understand what is technically feasible and where we need to rethink our approach.\nOne of our main learnings this month has been that progress sometimes comes from stepping back and asking better questions, rather than immediately moving forward with a solution.\nThank you to everyone who has contributed with their curiosity, perspectives and willingness to help. We are entering December with a clearer direction and a better understanding of what we want to achieve together.","bravos":["kari","hanne"]},{"id":"p-design","type":"dept","dept":"design","authorId":"nora","month":"November 2026","status":"published","ts":1795341885344,"title":"Making the complex a little simpler","body":"Throughout November, we have been exploring how to make our product more intuitive, accessible and welcoming to new customers.\nMembers of the team have contributed through user testing, prototyping, sharing feedback and refining existing designs. Some of the most valuable contributions have come from small observations and conversations that challenged how we initially approached a problem.\nThe insights shared by Product have given us a better understanding of the customer journey, while our collaboration with Engineering has helped us turn ideas into solutions that can work in practice.\nNot every design we explored turned out as expected, but these experiences have helped us understand our users better and make more informed decisions moving forward.\nWhat stands out this month is how much our work has benefited from different perspectives, both within and outside the department. The experience we create for our customers is not the result of design alone, but of many people bringing their knowledge together.","bravos":["martin"]},{"id":"p-eng","type":"dept","dept":"engineering","authorId":"erik","month":"November 2026","status":"published","ts":1795324605344,"title":"Building a stronger foundation for what comes next","body":"November has been a month of both development and improvement. Alongside building functionality for the new onboarding experience, we have spent time improving the underlying systems that make our product more reliable and easier to develop.\nThroughout the month, colleagues have contributed by solving technical challenges, reviewing each other's work, sharing knowledge, documenting solutions and helping one another when unexpected issues arose.\nMuch of this work may not be immediately visible to the rest of the organization, but it creates the foundation for many of the improvements we are working towards together.\nOur collaboration with Product and Design has also helped us better understand the purpose behind the features we develop. Being involved in these conversations early has allowed us to explore alternative solutions and identify potential challenges together.\nWe have learned a lot from both the things that worked and the things that required us to change direction. Thank you to everyone who has made time to support colleagues and share what they know.","bravos":["hanne","nora"]},{"id":"p-people","type":"dept","dept":"people","authorId":"camilla","month":"November 2026","status":"published","ts":1795307325344,"title":"Creating better conditions for people to do their work","body":"This month, we have been working on how we can better support our colleagues in their everyday work as the organization continues to grow.\nMembers of our team have contributed by listening to employees across departments, gathering feedback on internal processes and exploring ways to improve knowledge sharing, collaboration and employee onboarding.\nThrough conversations with Product, Design and Engineering, we have gained a better understanding of the different challenges people experience in their work. This has helped us identify opportunities to simplify internal processes, create clearer expectations and make it easier for colleagues to access the support they need.\nAn important learning this month has been that improving the employee experience is not something People & Culture can do in isolation. It depends on people across the organization being willing to share their experiences, raise concerns and contribute their perspectives.\nThank you to everyone who has taken the time to share their thoughts with us. These conversations help us create a workplace where people have better opportunities to learn, develop and contribute in ways that are meaningful to them.","bravos":["erik"]},{"id":"p-ceo","type":"ceo","dept":null,"authorId":"hanne","month":"November 2026","status":"published","ts":1795445565344,"title":"Different contributions, shared momentum","body":"Looking back at November, what stands out to me is not just what we have achieved, but how the work taking place across our organization is coming together.\nOur Product team has helped us better understand the needs of our customers and given us a clearer direction. Design has built on these insights to create a more intuitive and welcoming customer experience. Engineering has been turning these ideas into reality while strengthening the technical foundation that allows us to continue developing our product. At the same time, People & Culture has been working to create better conditions for us all to collaborate, learn and do meaningful work.\nThese are not four separate stories. They are different parts of the same story.\nThe insights gathered in one department inform decisions in another. The challenges solved by one colleague create opportunities for someone else. The time spent sharing knowledge, offering feedback or helping a colleague may seem like a small part of our working day, but these contributions are an important part of how we move forward as an organization.\nProgress is also about more than the things we complete. It is found in the questions we ask, the mistakes we learn from, the ideas we explore and the ways we support one another along the way. Not everything goes according to plan, and there is value in what we learn when it does not.\nI hope that reading about the work taking place across our departments helps you see how your own contributions fit into the bigger picture. Regardless of where you work in the organization, you are part of something we are building together.\nThank you for what you have brought to our organization this month, whether through your everyday work, your ideas, your willingness to learn or the support you have offered to others.\nOur momentum is something we create together.","bravos":["martin","nora","jonas"]}],"notifications":{"kari":[{"id":"hpw5wn0m","type":"bravo","ts":1795549965344,"read":false,"from":"jonas","kind":"weekly","goal":1},{"id":"v0ppq0od","type":"achieved","ts":1795539165344,"read":false,"from":"ingrid","eventId":"tl42pwrv","kind":"weekly","goal":2},{"id":"r2w54jim","type":"ceo","ts":1795445565344,"read":false,"postId":"p-ceo"},{"id":"xvp1bcap","type":"post","ts":1795359165344,"read":true,"postId":"p-product"},{"id":"oy3cr2lc","type":"reminder","ts":1795438365344,"read":true,"text":"Set your two weekly goals"}],"martin":[{"id":"z80hfg1k","type":"reminder","ts":1795611165344,"read":false,"text":"Your weekly team summary is ready"},{"id":"el3502wi","type":"achieved","ts":1795546365344,"read":false,"from":"kari","eventId":"st4aiun5","kind":"weekly","goal":1},{"id":"8iyqchvk","type":"ceo","ts":1795445565344,"read":false,"postId":"p-ceo"},{"id":"nd553suz","type":"achieved","ts":1795510365344,"read":true,"from":"ahmed","eventId":"ypxmwian","kind":"monthly","goal":0}],"hanne":[{"id":"6kh63ovm","type":"reminder","ts":1795603965344,"read":false,"text":"Your weekly organization summary is ready"},{"id":"q5kd738r","type":"post","ts":1795308765344,"read":true,"postId":"p-people"},{"id":"utzql70r","type":"post","ts":1795323165344,"read":true,"postId":"p-eng"}],"jonas":[],"ingrid":[],"sindre":[],"marte":[],"ahmed":[],"silje":[],"lise":[],"omar":[],"thea":[],"henrik":[],"aisha":[],"ola":[],"mia":[],"jakob":[],"emma":[],"viktor":[],"sara":[],"eline":[],"magnus":[],"nina":[],"peter":[],"nora":[],"erik":[],"camilla":[]},"notes":{"martin":{},"hanne":{}},"simIdx":0,"info":[{"title":"Why This App?","body":"Momentum is designed to help you experience progress, find meaning in your everyday work and feel connected to the people you work with.\n\nBy setting your own weekly goals, you can direct your attention towards what matters to you, recognize your progress and reflect on what helps or challenges you along the way.\n\nMomentum also gives us an opportunity to acknowledge each other's contributions, learn about what is happening across departments and better understand how our individual efforts contribute to something bigger.\n\nThe purpose is not to make you work more, achieve more than your colleagues or prove your abilities. It is about supporting your motivation, development and sense of belonging at work.\n\n**Your goals, your progress, our shared momentum.**"},{"title":"How to Use Momentum","body":"Momentum is intended to be a small and supportive part of your working week, not another task on your to-do list. Use it to set meaningful goals, reflect on your experiences, celebrate your progress and track your own momentum!\n\n## At the beginning of each month\nSet one monthly goal that gives you a broader direction for the month ahead. Consider what you would like to achieve, develop or learn, and why it is meaningful to you and your work. Use this opportunity to challenge yourself with a more ambitious yet attainable goal and experience the satisfaction of working towards and achieving it!\n\n## At the beginning of each week\nSet two weekly goals that reflect your own priorities, circumstances and development. These can contribute to your monthly goal or address other important aspects of your work. Choose goals that are meaningful to you and realistic given the week ahead.\n\n## Throughout the week\nMark your goals as achieved as you complete them, and feel free to adjust them if circumstances or priorities change. You can also support your colleagues by sending a Bravo! whenever you feel like acknowledging their progress.\n\n## At the end of the week\nTake a moment to reflect on how your week went. Consider what you have learned, what helped you make progress, what got in the way and whether there is anything you would like to approach differently. Write your reflection in your own words, focusing on what you find relevant and meaningful. Remember that an unfinished goal can provide just as valuable an opportunity for learning as a completed one.\n\n## Once a month\nExplore updates from other departments and the CEO. Take the opportunity to learn about what your colleagues are working on, understand how your own work connects to theirs and show appreciation for the contributions of other departments.\n\n## Keep it simple!\nSet aside some time at the beginning and end of each week to thoughtfully set your goals and reflect on your progress. Throughout the week, engage with Momentum whenever you find it valuable. Use it in a way that supports your work rather than interrupts it."},{"title":"Privacy – Who Sees What","body":"Momentum is built around trust, openness and respect for your privacy. You should feel comfortable setting meaningful goals and reflecting honestly on your experiences without worrying about how your performance might be evaluated.\n\n## Your monthly and weekly goals\nThe content of your monthly goal and two weekly goals is only visible to you and your manager. Your colleagues can see when you achieve a goal, allowing them to acknowledge your progress, but they cannot see what the goal is about.\n\n## Your Friday reflection\nYour written reflections are only visible to you and your manager. This gives you an opportunity to share your experiences, thoughts and challenges in your own words. Your reflections can help your manager better understand your perspective, recognize your development and identify ways to support you. Share what you feel comfortable sharing and what you find relevant to your work.\n\n## Monthly updates\nDepartment updates and messages from the CEO are visible across the organization. These updates focus on collective contributions, learning and progress rather than individual performance.\n\n## Support, not evaluation\nYour manager's access to your goals and reflections is intended to create a foundation for meaningful conversations, constructive feedback and ongoing support. It provides an opportunity for your manager to better understand what matters to you, what you are working towards and what might help you move forward.\n\nMomentum is not a tool for monitoring, micromanaging or evaluating your performance. Your goals, reflections and level of engagement with Momentum are not to be used for performance evaluations, employee rankings or compensation decisions.\n\nYour goals are yours to pursue. Your manager is there to support you along the way."},{"title":"Tips for Good Goals","body":"Good goals give you direction, encourage development and help you recognize your own progress. When setting your weekly goals, consider the following principles to make them as meaningful and valuable as possible.\n\n## Make your goals meaningful\nChoose goals that matter to you, your work or your personal development. Take a moment to consider why a goal is worth pursuing and what you hope to gain from achieving it.\n\n## Be specific\nFormulate your goals clearly enough that you know what you are working towards and when you have achieved them. Rather than setting a goal to \"improve collaboration\", consider a specific action that could help you do so.\n\n## Challenge yourself realistically\nGood goals encourage you to put in effort and develop your abilities. Aim for something that challenges you while remaining achievable given your time, resources and other responsibilities.\n\n## Focus on what you can influence\nChoose goals that you have a reasonable degree of control over. While some outcomes depend on others or circumstances outside your control, you can often identify meaningful actions that help you move in the right direction.\n\n## Make room for learning\nNot every goal needs to be about delivering something or completing a task. Developing a skill, exploring a new approach, seeking feedback or gaining a better understanding of something can be equally valuable forms of progress.\n\n## Connect your goals when it makes sense\nYour weekly goals can serve as stepping stones towards your monthly goal, helping you make a larger ambition more manageable. However, they can also address other aspects of your work that you find meaningful. The choice is yours.\n\n## Be flexible\nPriorities change, unexpected challenges arise and some things take longer than anticipated. Feel free to reconsider or adjust your goals when circumstances change. There is also value in recognizing when you need support from others.\n\n## Think beyond the checkbox\nSet goals because they are meaningful to you, not simply because they are easy to complete. Remember that your goals represent only a part of your work, and that many valuable contributions happen beyond the goals you set in Momentum.\n\nThe value of a goal lies in what it helps you achieve, experience and learn along the way, not simply in being able to tick it off."},{"title":"Using WOOP to Set Your Monthly Goals","body":"Setting a meaningful goal is a great starting point, but knowing how to work towards it can make all the difference.\n\nWOOP is a science-based mental strategy that helps you turn your ambitions into action. It encourages you to imagine what you would like to achieve, recognize what might hold you back and prepare yourself to overcome potential obstacles.\n\nWhen setting your monthly goal in Momentum, take some time to work through the four steps of WOOP.\n\n## W – Wish\nWhat would you like to achieve, learn or get better at this month?\n\nIdentify a wish that is personally meaningful, challenging and attainable. Choose something that you would genuinely like to work towards and that could contribute to your development.\n\n## O – Outcome\nWhat would be the best thing to come out of achieving your wish?\n\nTake a moment to imagine what achieving your goal would look and feel like. Consider what it would mean to you, how it could benefit your work or development, and why it is worth pursuing.\n\n## O – Obstacle\nWhat within you might hold you back from achieving your wish?\n\nReflect on the habits, thoughts, feelings or behaviours that could get in the way. Perhaps you tend to postpone certain tasks, feel uncertain about trying something new or spend too much time preparing rather than taking action.\n\nTry to identify and imagine the main obstacle you are likely to encounter. Recognizing an obstacle is not a sign of weakness, but an opportunity to prepare for it.\n\n## P – Plan\nWhat could you do when you encounter this obstacle?\n\nCreate a simple and specific if–then plan that connects your obstacle to an action you can take to overcome it.\n\n> If I encounter this obstacle, then I will take this action.\n\nHaving a plan in place can make it easier to respond constructively when challenges arise.\n\n## Put your WOOP into practice\nThroughout the month, you can revisit your goal, reflect on your progress and use your weekly goals to take smaller steps towards your wish.\n\nRemember that some obstacles are beyond your individual control. If you encounter barriers that require additional resources, guidance or support, consider discussing them with your manager or colleagues.\n\nWOOP is not about expecting everything to go according to plan. It is about understanding what matters to you, preparing for challenges and giving yourself a better opportunity to succeed.\n\nIf you would like to learn more about the technique and the science behind it, visit woopmylife.org."},{"title":"FAQ","body":"Q: Do my weekly goals have to be connected to my monthly goal?\nNo. Your weekly goals can help you take smaller steps towards your monthly goal, but they can also address other meaningful aspects of your work. Choose what makes sense for you and your current priorities.\n\nQ: What happens if I don't achieve my goals?\nNot achieving a goal is a natural part of working life and does not have negative consequences in Momentum. It can be an opportunity to reflect on what you have learned, what got in the way and whether a different approach or additional support could help you move forward. Progress comes in many forms, not just completed goals.\n\nQ: Can I change my goals during the week or month?\nYes. Priorities change, unexpected challenges arise and new opportunities emerge. Feel free to reconsider your goals when circumstances change. Your goals should give you direction, not prevent you from adapting.\n\nQ: Can my goals be about learning rather than delivering something?\nAbsolutely! Developing a skill, gaining a better understanding of something, seeking feedback or exploring a new way of working are all valuable forms of progress. Your monthly goal is a particularly good opportunity to focus on your personal and professional development.\n\nQ: What if I am unsure about what goals to set?\nStart by considering what matters to you, what you find interesting or what you would like to get better at. You can find guidance in the \"Tips for good goals\" section or use the WOOP technique to explore your monthly ambitions. Your manager and colleagues can also be valuable sources of inspiration and support.\n\nQ: What if I encounter obstacles that are outside my control?\nNot every obstacle is something you can or should overcome on your own. Feel free to raise these challenges in your Friday reflection or discuss them directly with your manager or colleagues. Identifying barriers is an important part of understanding how we can better support each other.\n\nQ: Why can my manager see my goals and reflections?\nYour manager's access is intended to help them better understand your priorities, experiences and development. It provides a foundation for meaningful conversations, constructive feedback and individualized support. Your manager is there to help you pursue your goals, not to judge you based on whether you achieve them.\n\nQ: What should I write in my Friday reflection?\nThere is no right or wrong answer. Your reflection is an opportunity to look back on your week and express what you find meaningful or relevant. You might reflect on something you learned, a challenge you experienced, a positive interaction or something you would like to approach differently. Write in your own words and share what you feel comfortable sharing.\n\nQ: Do I have to send Bravo! to my colleagues?\nNo. Bravo! is a voluntary way of showing genuine appreciation and cheering each other on. There is no expectation to send a certain number of reactions or to return a Bravo! you receive.\n\nQ: Does receiving more Bravo! mean someone is doing better than others?\nNo. Bravo! is a gesture of encouragement, not a measure of performance, popularity or contribution. We all work differently, pursue different goals and contribute in ways that may not always be visible to others.\n\nQ: Is Momentum a measure of my productivity or performance?\nNo. The number of goals you achieve does not necessarily reflect the quality, complexity or value of your work. Many meaningful contributions happen beyond the goals you set in Momentum. Your goal attainment, reflections and engagement with the app are not to be used for performance evaluations, rankings or compensation decisions.\n\nQ: How often should I use Momentum?\nWe encourage you to make goal setting and reflection a natural part of your working week. Beyond this, engage with Momentum whenever you find it meaningful or valuable. There is no expectation to check the app continuously.\n\nQ: What if using Momentum starts to feel stressful?\nTake a moment to consider whether your goals are realistic, whether you are putting unnecessary pressure on yourself or whether your circumstances have changed. Feel free to adjust your goals, reconsider how you engage with the app or discuss your experiences with your manager.\n\nMomentum is intended to support your motivation, development and well-being, not become an additional source of pressure.\n\nQ: Does Momentum replace regular conversations with my manager and colleagues?\nNo. Momentum is intended to complement the interactions we already have at work. While it can provide a starting point for meaningful conversations, feedback and mutual appreciation, genuine relationships and everyday interactions remain an essential part of how we support each other."}],"savedAt":1795694791080,"handbook":{},"roleHintSeen":false}</script>

<script>
/* ============ constants ============ */
const DEPTS=[{id:'product',name:'Product',leader:'martin'},{id:'design',name:'Design',leader:'nora'},{id:'engineering',name:'Engineering',leader:'erik'},{id:'people',name:'People & Culture',leader:'camilla'}];
const ROLE_USER={employee:'kari',leader:'martin',ceo:'hanne'};
const ROLE_LABEL={employee:'Employee',leader:'Leader',ceo:'CEO'};
const STATUS=['Just started','Making progress','Almost there','Achieved'];
const AV={
  bg:['#4E2272','#EFE8F5','#F4C95D','#9BC1BC','#E07A5F','#3D5A80','#F2CC8F','#81B29A'],
  skin:['#FFDBB4','#EDB98A','#D08B5B','#AE5D29','#614335'],
  hairColor:['#2C1B18','#724133','#B58143','#D6B370','#A55728','#E8E1E1'],
  shirt:['#4E2272','#E07A5F','#3D5A80','#81B29A','#2B2D31','#F4C95D'],
  hair:['none','short','long','bun','curly'],eyes:['dots','happy','wink'],mouth:['smile','grin','neutral'],acc:['none','glasses','sunglasses','cap']
};
const LIGHT_BG=['#EFE8F5','#F4C95D','#9BC1BC','#F2CC8F','#81B29A'];
const STORE_KEY='momentum-demo-v3';
const DAY=864e5, HOUR=36e5;

/* Reflection coding: self-determination theory needs + common obstacles */
const CODES=[
  {id:'autonomy',label:'Autonomy',need:true,pos:['my own way','own way','freedom','trusted','got to decide','got to plan','independently','free to'],neg:['more say','no say','micromanag','told exactly','not allowed','controlled','decided for me','no control']},
  {id:'competence',label:'Competence',need:true,pos:['learned','learnt','better than expected','more confident','figured out','improved','got better','mastered','taught','proud'],neg:['unsure','stuck','don’t know',"don't know",'struggl','not good enough','overwhelmed','lost']},
  {id:'relatedness',label:'Relatedness',need:true,pos:['helped','support','together','collaboration','feedback','closely with','worked well','team spirit','thanks'],neg:['alone','isolated','nobody','no one','conflict','left out','lonely']},
  {id:'workload',label:'Workload & meetings',neg:['meetings','busy','overtime','too much','deadline','long days','no time']},
  {id:'priorities',label:'Unclear priorities',neg:['unclear','priorit','changing','changes in the plan','what was most important','confus']},
  {id:'waiting',label:'Waiting on others',neg:['waiting','waited','blocked','delayed','depend']},
  {id:'tools',label:'Tools & resources',neg:['missing tools','tools','equipment','software','access','is slow']},
  {id:'energy',label:'Energy & wellbeing',neg:['tired','stress','exhausted','drained','long days','overtime','burn']}
];
const NEED_TXT={autonomy:{pos:'Feels trusted',neg:'Wants more say'},competence:{pos:'Learning & growing',neg:'Feels stuck'},relatedness:{pos:'Good support',neg:'Feels alone'}};
const NEED_EV={autonomy:['feel trusted to decide how they work','want more say in how work is done'],competence:['describe learning or growing','feel stuck or unsure'],relatedness:['mention good support from colleagues','feel alone or isolated']};
const ACTIONS={
  autonomy:'Give more say in how work is planned – agree on the goal, and let people choose the route.',
  competence:'Offer feedback, pairing or short training where people feel stuck. Celebrate learning, not just results.',
  relatedness:'Create space for collaboration – pair people on tasks and check in with those working alone.',
  workload:'Review recurring meetings and protect blocks of focus time.',
  priorities:'Start the week with a short priorities check-in so everyone knows what matters most.',
  waiting:'Map dependencies and agree on response times with the teams you depend on.',
  tools:'Follow up on missing tools, equipment or access – removing a blocker quickly signals that you care.',
  energy:'Talk about workload and recovery in 1:1s – sustained motivation needs energy.'
};

/* ============ helpers ============ */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y)/DAY+1)/7);}
const WEEK=isoWeek(new Date());
const monthLabel=(o=0)=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+o);return d.toLocaleString('en-GB',{month:'long',year:'numeric'});};
const MONTH=monthLabel(0).split(' ')[0];
function ago(ts){const s=(Date.now()-ts)/1000;if(s<60)return 'Just now';if(s<3600)return Math.floor(s/60)+' min ago';if(s<86400){const h=Math.floor(s/3600);return h+(h===1?' hour ago':' hours ago');}if(s<7*86400){const d=Math.floor(s/86400);return d===1?'Yesterday':d+' days ago';}return new Date(ts).toLocaleDateString('en-GB',{day:'numeric',month:'short'});}
function seeded(n){let x=Math.sin(n*9301+49297)*233280;return x-Math.floor(x);}
function randomAvatar(seed){const pick=(a,k)=>a[Math.floor(seeded(seed*7+k)*a.length)];return {style:'character',bg:pick(AV.bg,1),skin:pick(AV.skin,2),hair:pick(AV.hair.slice(1),3),hairColor:pick(AV.hairColor,4),eyes:pick(AV.eyes,5),mouth:pick(AV.mouth,6),acc:pick(AV.acc,7),shirt:pick(AV.shirt,8)};}
function codeText(text){
  const t=(text||'').toLowerCase(), out=[];
  if(!t.trim()) return out;
  CODES.forEach(c=>{
    const n=(c.neg||[]).filter(k=>t.includes(k)).length, p=(c.pos||[]).filter(k=>t.includes(k)).length;
    if(c.need){ if(n>p) out.push({id:c.id,sent:'neg'}); else if(p>0) out.push({id:c.id,sent:'pos'}); }
    else if(n>0) out.push({id:c.id,sent:'neg'});
  });
  return out;
}
const codeLabel=c=>{const def=CODES.find(x=>x.id===c.id);return def.need?NEED_TXT[c.id][c.sent]:def.label;};
const codeTag=c=>{const def=CODES.find(x=>x.id===c.id);return `<span class="tag ${def.need?(c.sent==='pos'?'pos':'neg'):'obs'}">${esc(codeLabel(c))}</span>`;};

/* ============ avatar svg ============ */
function avatarSVG(user, size=40){
  const a=user.avatar, name=esc(user.name);
  const st=`width="${size}" height="${size}" style="border-radius:50%;display:block;flex-shrink:0"`;
  if(a.style==='initials'){
    const ini=esc(user.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase());
    const fg=LIGHT_BG.includes(a.bg)?'#1B1D1F':'#FFFFFF';
    return `<svg viewBox="0 0 64 64" ${st} role="img" aria-label="${name}"><rect width="64" height="64" fill="${a.bg}"/><text x="32" y="40" text-anchor="middle" font-size="22" font-weight="600" font-family="Inter,sans-serif" fill="${fg}">${ini}</text></svg>`;
  }
  const hc=a.hairColor, D='#1B1D1F';
  let back='', front='';
  const top=`<path d="M19.5 27C19 15 26 12 32 12S45 15 44.5 27C42 21 37 18.5 32 18.5S22 21 19.5 27Z" fill="${hc}"/>`;
  if(a.hair==='short') front=top;
  if(a.hair==='long'){ back=`<path d="M18 30C18 13 46 13 46 30V52H40V32H24V52H18Z" fill="${hc}"/>`; front=top; }
  if(a.hair==='bun') front=top+`<circle cx="32" cy="11" r="5.5" fill="${hc}"/>`;
  if(a.hair==='curly') front=[[20,25],[22,19],[27,15],[32,13.5],[37,15],[42,19],[44,25]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="5" fill="${hc}"/>`).join('');
  let eyes='';
  if(a.eyes==='dots') eyes=`<circle cx="27.5" cy="29" r="1.7" fill="${D}"/><circle cx="36.5" cy="29" r="1.7" fill="${D}"/>`;
  if(a.eyes==='happy') eyes=`<path d="M25.5 29.6q2-2.4 4 0M34.5 29.6q2-2.4 4 0" stroke="${D}" stroke-width="1.6" fill="none" stroke-linecap="round"/>`;
  if(a.eyes==='wink') eyes=`<circle cx="27.5" cy="29" r="1.7" fill="${D}"/><path d="M34.5 29.6q2-2.4 4 0" stroke="${D}" stroke-width="1.6" fill="none" stroke-linecap="round"/>`;
  let mouth='';
  if(a.mouth==='smile') mouth=`<path d="M28 34.5q4 3.5 8 0" stroke="${D}" stroke-width="1.6" fill="none" stroke-linecap="round"/>`;
  if(a.mouth==='grin') mouth=`<path d="M27.5 34h9q-1 5-4.5 5t-4.5-5z" fill="#fff" stroke="${D}" stroke-width="1.3" stroke-linejoin="round"/>`;
  if(a.mouth==='neutral') mouth=`<path d="M28.5 35.5h7" stroke="${D}" stroke-width="1.6" stroke-linecap="round"/>`;
  let acc='';
  if(a.acc==='glasses') acc=`<g fill="none" stroke="${D}" stroke-width="1.4"><circle cx="27.5" cy="29" r="3.6"/><circle cx="36.5" cy="29" r="3.6"/><path d="M31.1 29h1.8"/></g>`;
  if(a.acc==='sunglasses') acc=`<g fill="${D}"><rect x="23" y="26.5" width="8.5" height="5.5" rx="2"/><rect x="32.5" y="26.5" width="8.5" height="5.5" rx="2"/><rect x="30" y="27.6" width="4" height="1.2"/></g>`;
  if(a.acc==='cap') acc=`<path d="M19 24C19 12.5 45 12.5 45 24Z" fill="#2B2D31"/><path d="M30 23.2H50Q52.5 23.6 50 26.4H30Z" fill="#2B2D31"/>`;
  return `<svg viewBox="0 0 64 64" ${st} role="img" aria-label="${name}"><rect width="64" height="64" fill="${a.bg}"/><path d="M10 66C10 52 20 46 32 46S54 52 54 66Z" fill="${a.shirt}"/>${back}<rect x="28" y="37" width="8" height="10" fill="${a.skin}"/><ellipse cx="32" cy="29" rx="12.5" ry="14" fill="${a.skin}"/>${front}${eyes}${mouth}${acc}</svg>`;
}

const INFO_SEED=[
{title:'Why This App?',body:`Momentum is designed to help you experience progress, find meaning in your everyday work and feel connected to the people you work with.

By setting your own weekly goals, you can direct your attention towards what matters to you, recognize your progress and reflect on what helps or challenges you along the way.

Momentum also gives us an opportunity to acknowledge each other's contributions, learn about what is happening across departments and better understand how our individual efforts contribute to something bigger.

The purpose is not to make you work more, achieve more than your colleagues or prove your abilities. It is about supporting your motivation, development and sense of belonging at work.

**Your goals, your progress, our shared momentum.**`},
{title:'How to Use Momentum',body:`Momentum is intended to be a small and supportive part of your working week, not another task on your to-do list. Use it to set meaningful goals, reflect on your experiences, celebrate your progress and track your own momentum!

## At the beginning of each month
Set one monthly goal that gives you a broader direction for the month ahead. Consider what you would like to achieve, develop or learn, and why it is meaningful to you and your work. Use this opportunity to challenge yourself with a more ambitious yet attainable goal and experience the satisfaction of working towards and achieving it!

## At the beginning of each week
Set two weekly goals that reflect your own priorities, circumstances and development. These can contribute to your monthly goal or address other important aspects of your work. Choose goals that are meaningful to you and realistic given the week ahead.

## Throughout the week
Mark your goals as achieved as you complete them, and feel free to adjust them if circumstances or priorities change. You can also support your colleagues by sending a Bravo! whenever you feel like acknowledging their progress.

## At the end of the week
Take a moment to reflect on how your week went. Consider what you have learned, what helped you make progress, what got in the way and whether there is anything you would like to approach differently. Write your reflection in your own words, focusing on what you find relevant and meaningful. Remember that an unfinished goal can provide just as valuable an opportunity for learning as a completed one.

## Once a month
Explore updates from other departments and the CEO. Take the opportunity to learn about what your colleagues are working on, understand how your own work connects to theirs and show appreciation for the contributions of other departments.

## Keep it simple!
Set aside some time at the beginning and end of each week to thoughtfully set your goals and reflect on your progress. Throughout the week, engage with Momentum whenever you find it valuable. Use it in a way that supports your work rather than interrupts it.`},
{title:'Privacy – Who Sees What',body:`Momentum is built around trust, openness and respect for your privacy. You should feel comfortable setting meaningful goals and reflecting honestly on your experiences without worrying about how your performance might be evaluated.

## Your monthly and weekly goals
The content of your monthly goal and two weekly goals is only visible to you and your manager. Your colleagues can see when you achieve a goal, allowing them to acknowledge your progress, but they cannot see what the goal is about.

## Your Friday reflection
Your written reflections are only visible to you and your manager. This gives you an opportunity to share your experiences, thoughts and challenges in your own words. Your reflections can help your manager better understand your perspective, recognize your development and identify ways to support you. Share what you feel comfortable sharing and what you find relevant to your work.

## Monthly updates
Department updates and messages from the CEO are visible across the organization. These updates focus on collective contributions, learning and progress rather than individual performance.

## Support, not evaluation
Your manager's access to your goals and reflections is intended to create a foundation for meaningful conversations, constructive feedback and ongoing support. It provides an opportunity for your manager to better understand what matters to you, what you are working towards and what might help you move forward.

Momentum is not a tool for monitoring, micromanaging or evaluating your performance. Your goals, reflections and level of engagement with Momentum are not to be used for performance evaluations, employee rankings or compensation decisions.

Your goals are yours to pursue. Your manager is there to support you along the way.`},
{title:'Tips for Good Goals',body:`Good goals give you direction, encourage development and help you recognize your own progress. When setting your weekly goals, consider the following principles to make them as meaningful and valuable as possible.

## Make your goals meaningful
Choose goals that matter to you, your work or your personal development. Take a moment to consider why a goal is worth pursuing and what you hope to gain from achieving it.

## Be specific
Formulate your goals clearly enough that you know what you are working towards and when you have achieved them. Rather than setting a goal to "improve collaboration", consider a specific action that could help you do so.

## Challenge yourself realistically
Good goals encourage you to put in effort and develop your abilities. Aim for something that challenges you while remaining achievable given your time, resources and other responsibilities.

## Focus on what you can influence
Choose goals that you have a reasonable degree of control over. While some outcomes depend on others or circumstances outside your control, you can often identify meaningful actions that help you move in the right direction.

## Make room for learning
Not every goal needs to be about delivering something or completing a task. Developing a skill, exploring a new approach, seeking feedback or gaining a better understanding of something can be equally valuable forms of progress.

## Connect your goals when it makes sense
Your weekly goals can serve as stepping stones towards your monthly goal, helping you make a larger ambition more manageable. However, they can also address other aspects of your work that you find meaningful. The choice is yours.

## Be flexible
Priorities change, unexpected challenges arise and some things take longer than anticipated. Feel free to reconsider or adjust your goals when circumstances change. There is also value in recognizing when you need support from others.

## Think beyond the checkbox
Set goals because they are meaningful to you, not simply because they are easy to complete. Remember that your goals represent only a part of your work, and that many valuable contributions happen beyond the goals you set in Momentum.

The value of a goal lies in what it helps you achieve, experience and learn along the way, not simply in being able to tick it off.`},
{title:'Using WOOP to Set Your Monthly Goals',body:`Setting a meaningful goal is a great starting point, but knowing how to work towards it can make all the difference.

WOOP is a science-based mental strategy that helps you turn your ambitions into action. It encourages you to imagine what you would like to achieve, recognize what might hold you back and prepare yourself to overcome potential obstacles.

When setting your monthly goal in Momentum, take some time to work through the four steps of WOOP.

## W – Wish
What would you like to achieve, learn or get better at this month?

Identify a wish that is personally meaningful, challenging and attainable. Choose something that you would genuinely like to work towards and that could contribute to your development.

## O – Outcome
What would be the best thing to come out of achieving your wish?

Take a moment to imagine what achieving your goal would look and feel like. Consider what it would mean to you, how it could benefit your work or development, and why it is worth pursuing.

## O – Obstacle
What within you might hold you back from achieving your wish?

Reflect on the habits, thoughts, feelings or behaviours that could get in the way. Perhaps you tend to postpone certain tasks, feel uncertain about trying something new or spend too much time preparing rather than taking action.

Try to identify and imagine the main obstacle you are likely to encounter. Recognizing an obstacle is not a sign of weakness, but an opportunity to prepare for it.

## P – Plan
What could you do when you encounter this obstacle?

Create a simple and specific if–then plan that connects your obstacle to an action you can take to overcome it.

> If I encounter this obstacle, then I will take this action.

Having a plan in place can make it easier to respond constructively when challenges arise.

## Put your WOOP into practice
Throughout the month, you can revisit your goal, reflect on your progress and use your weekly goals to take smaller steps towards your wish.

Remember that some obstacles are beyond your individual control. If you encounter barriers that require additional resources, guidance or support, consider discussing them with your manager or colleagues.

WOOP is not about expecting everything to go according to plan. It is about understanding what matters to you, preparing for challenges and giving yourself a better opportunity to succeed.

If you would like to learn more about the technique and the science behind it, visit woopmylife.org.`},
{title:'FAQ',body:`Q: Do my weekly goals have to be connected to my monthly goal?
No. Your weekly goals can help you take smaller steps towards your monthly goal, but they can also address other meaningful aspects of your work. Choose what makes sense for you and your current priorities.

Q: What happens if I don't achieve my goals?
Not achieving a goal is a natural part of working life and does not have negative consequences in Momentum. It can be an opportunity to reflect on what you have learned, what got in the way and whether a different approach or additional support could help you move forward. Progress comes in many forms, not just completed goals.

Q: Can I change my goals during the week or month?
Yes. Priorities change, unexpected challenges arise and new opportunities emerge. Feel free to reconsider your goals when circumstances change. Your goals should give you direction, not prevent you from adapting.

Q: Can my goals be about learning rather than delivering something?
Absolutely! Developing a skill, gaining a better understanding of something, seeking feedback or exploring a new way of working are all valuable forms of progress. Your monthly goal is a particularly good opportunity to focus on your personal and professional development.

Q: What if I am unsure about what goals to set?
Start by considering what matters to you, what you find interesting or what you would like to get better at. You can find guidance in the "Tips for good goals" section or use the WOOP technique to explore your monthly ambitions. Your manager and colleagues can also be valuable sources of inspiration and support.

Q: What if I encounter obstacles that are outside my control?
Not every obstacle is something you can or should overcome on your own. Feel free to raise these challenges in your Friday reflection or discuss them directly with your manager or colleagues. Identifying barriers is an important part of understanding how we can better support each other.

Q: Why can my manager see my goals and reflections?
Your manager's access is intended to help them better understand your priorities, experiences and development. It provides a foundation for meaningful conversations, constructive feedback and individualized support. Your manager is there to help you pursue your goals, not to judge you based on whether you achieve them.

Q: What should I write in my Friday reflection?
There is no right or wrong answer. Your reflection is an opportunity to look back on your week and express what you find meaningful or relevant. You might reflect on something you learned, a challenge you experienced, a positive interaction or something you would like to approach differently. Write in your own words and share what you feel comfortable sharing.

Q: Do I have to send Bravo! to my colleagues?
No. Bravo! is a voluntary way of showing genuine appreciation and cheering each other on. There is no expectation to send a certain number of reactions or to return a Bravo! you receive.

Q: Does receiving more Bravo! mean someone is doing better than others?
No. Bravo! is a gesture of encouragement, not a measure of performance, popularity or contribution. We all work differently, pursue different goals and contribute in ways that may not always be visible to others.

Q: Is Momentum a measure of my productivity or performance?
No. The number of goals you achieve does not necessarily reflect the quality, complexity or value of your work. Many meaningful contributions happen beyond the goals you set in Momentum. Your goal attainment, reflections and engagement with the app are not to be used for performance evaluations, rankings or compensation decisions.

Q: How often should I use Momentum?
We encourage you to make goal setting and reflection a natural part of your working week. Beyond this, engage with Momentum whenever you find it meaningful or valuable. There is no expectation to check the app continuously.

Q: What if using Momentum starts to feel stressful?
Take a moment to consider whether your goals are realistic, whether you are putting unnecessary pressure on yourself or whether your circumstances have changed. Feel free to adjust your goals, reconsider how you engage with the app or discuss your experiences with your manager.

Momentum is intended to support your motivation, development and well-being, not become an additional source of pressure.

Q: Does Momentum replace regular conversations with my manager and colleagues?
No. Momentum is intended to complement the interactions we already have at work. While it can provide a starting point for meaningful conversations, feedback and mutual appreciation, genuine relationships and everyday interactions remain an essential part of how we support each other.`}
