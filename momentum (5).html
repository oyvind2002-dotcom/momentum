{id:'c1',n:'01',title:'Your role as a leader',sub:'Understanding your influence on motivation.',body:`**Motivation is not something you simply give to people. It is something you can create the conditions for.**

As a leader, you play an important role in shaping how your employees experience their work, approach challenges and understand what it means to succeed.

Momentum is designed to support employees in taking ownership of their goals, recognizing their progress, reflecting on their experiences and connecting with their colleagues. However, the value of Momentum depends largely on how it is used and how you, as a leader, respond to the insights it provides.

Your role is not to manage employees through Momentum, but to use Momentum as an opportunity to better support them.

## Understanding motivation
Not all motivation is the same. An employee may put effort into a task because they find it interesting, because they recognize its value, or because they feel pressured to perform and meet someone else's expectations.

While these different reasons may lead to similar behaviour in the short term, they can have different implications for employees' well-being, engagement and long-term motivation.

As a leader, you can help employees experience greater ownership and meaningfulness in their work by listening to their perspectives, providing opportunities for development and helping them understand the value of their contributions.

This does not mean that expectations, responsibilities or organizational priorities disappear. It means that the way you communicate and work with them matters.

## Support, not evaluation
Your access to employees' goals, WOOP reflections and Friday reflections provides you with valuable insights into their priorities, experiences, ambitions and challenges.

Use these insights to:
- Better understand what matters to your employees.
- Recognize opportunities for learning and development.
- Identify barriers and provide appropriate support.
- Initiate meaningful conversations.
- Offer constructive and individualized feedback.

Momentum is not a tool for monitoring individual productivity, comparing employees or evaluating their performance. Goal attainment, reflections and engagement with the platform must not be used as a basis for performance evaluations, rankings, compensation or sanctions.

Respect the trust employees place in you when sharing their reflections. Treat the information with discretion and avoid sharing personal goals or reflections with others without the employee's permission, except where disclosure is necessary under established organizational or legal obligations.

[reflect]
## Take a moment to reflect
When an employee opens Momentum, do they see an opportunity to develop themselves, or another place where they need to demonstrate their performance?

Your behaviour can make the difference.
[/reflect]`},
{id:'c2',n:'02',title:'Supporting the three psychological needs',sub:'Autonomy, competence and relatedness in practice.',body:`Research on motivation identifies three basic psychological needs that are important for people to thrive at work: autonomy, competence and relatedness.

As a leader, you have opportunities to support all three through your everyday interactions.

## 1. Autonomy – experiencing ownership
Autonomy is about experiencing a sense of choice and ownership over one's actions. It does not mean working independently, having complete freedom or being without responsibilities.

Employees can experience autonomy even when working within organizational expectations, provided they understand the purpose of their work and have meaningful opportunities to influence how they approach it.

**How you can support autonomy:**
- Listen to employees' perspectives before offering your own.
- Encourage employees to identify goals that are meaningful to them.
- Involve employees in decisions that affect their work.
- Explain the reasoning behind expectations and decisions.
- Offer meaningful choices within existing organizational boundaries.
- Avoid unnecessary pressure and micromanagement.

**Consider asking:**
? "What would you like to get better at, and how would you like to approach it?"

## 2. Competence – experiencing mastery and development
Competence is about feeling capable of dealing with challenges, developing one's abilities and making meaningful progress.

As a leader, you can support this by helping employees recognize their development, providing constructive feedback and creating opportunities for them to challenge themselves realistically.

**How you can support competence:**
- Recognize progress, improvement and effective strategies.
- Provide specific feedback that helps employees understand how to develop further.
- Encourage challenging yet attainable goals.
- Make relevant resources, guidance and learning opportunities available.
- Help employees recognize what they have learned, even when they have not achieved their intended outcome.

**Consider asking:**
? "What are you more comfortable doing now than you were a month ago?"

## 3. Relatedness – experiencing connection and belonging
Relatedness is about feeling connected to others, cared for and included as a valued member of a community.

Employees should experience that they matter to their colleagues and their organization, regardless of how many goals they achieve.

**How you can support relatedness:**
- Show genuine interest in employees and their experiences.
- Make time to listen and be available when support is needed.
- Recognize collaboration, knowledge sharing and everyday contributions.
- Encourage employees to support and learn from one another.
- Help employees understand how their work connects to the work of other departments.

**Consider asking:**
? "Is there someone who has helped you move forward, or someone you would benefit from working more closely with?"

## Bringing the three needs together
Supporting one psychological need should not come at the expense of another. Providing an employee with a challenging opportunity may support competence, but if they feel pressured to accept it or lack the necessary support, their experience may be quite different from what you intended.

Try to understand what your employees need rather than assuming that the same approach works for everyone.

The aim is to help people feel that they have ownership of their work, are capable of developing and belong to a community that supports them.`},
{id:'c3',n:'03',title:'Creating a mastery-oriented culture',sub:'Shaping how your team understands success.',body:`**What you consistently give attention to tells your employees what matters.**

The questions you ask, the behaviours you recognize and the way you respond to mistakes all communicate something about what it means to succeed within your team.

Over time, these signals help shape the motivational climate in which your employees work.

## Two different approaches to success
In a performance-oriented climate, success is largely defined by demonstrating one's abilities and performing better than others. Employees may become increasingly concerned with how they are perceived, whether they are meeting expectations and how their performance compares to that of their colleagues.

In a mastery-oriented climate, success is understood through learning, effort, improvement, collaboration and the development of one's abilities.

Momentum is designed to support a mastery-oriented climate, where employees are encouraged to develop themselves and support one another rather than compete against each other.

This does not mean that results are unimportant. It means that results are not the only thing we value, and that learning and development are important parts of achieving sustainable results.

## What you recognize matters
Imagine two employees. One achieves both weekly goals, while the other achieves neither but has explored a new approach, identified an important challenge and helped a colleague move forward.

Both employees may have made valuable contributions.

If your attention is directed exclusively towards completed goals, employees may gradually learn that ticking boxes matters more than experimenting, learning or helping others.

Make an effort to recognize the less visible aspects of progress as well.

## Responding to mistakes and unfinished goals
The way you respond when things do not go according to plan is particularly important.

An employee who feels comfortable discussing an unfinished goal can provide valuable insights into obstacles, unclear expectations, resource constraints or opportunities for development.

Approach these situations with curiosity rather than judgement. Explore what happened, what can be learned and what might help the employee move forward.

Encourage honest reflection while maintaining appropriate professional and ethical standards. Learning from mistakes does not mean ignoring their consequences.

## Lead by example
You are also learning and developing as a leader. Be open about your own experiences, acknowledge when something has not worked as intended and demonstrate a willingness to learn from others.

Ask for feedback, recognize the contributions of your employees and show that you value collaboration over individual recognition.

A mastery-oriented culture is not created through a single conversation or initiative. It develops through consistent behaviour over time.

[reflect]
## Take a moment to reflect
- What do I tend to recognize most: results, effort, improvement or collaboration?
- How do I respond when employees do not achieve their goals?
- Do my employees feel comfortable telling me when something has not gone according to plan?
- Am I encouraging people to develop themselves or to demonstrate their abilities to me?

Consider what your answers might tell you about the climate you are helping to create.
[/reflect]`},
{id:'c4',n:'04',title:'Supporting goals and reflections',sub:'Turning insights into meaningful conversations.',body:`Momentum gives you access to your employees' self-selected monthly and weekly goals, WOOP reflections and Friday reflections.

Think of this information as a starting point for understanding your employees rather than a complete picture of their work or performance.

## Supporting weekly goals
Weekly goals provide employees with opportunities to direct their attention towards meaningful activities and experience a sense of progress.

Allow employees to take ownership of their goals. Your role is to help them reflect on whether their goals are meaningful, sufficiently specific and appropriately challenging given their circumstances.

If an employee is struggling to formulate a goal, avoid immediately suggesting one yourself. Instead, help them explore what they would like to achieve or develop.

Consider asking:
- What makes this goal meaningful to you?
- What would achieving it look like?
- How does it fit with your other priorities this week?
- What resources or support might you need?

Remember that employees have responsibilities beyond the goals they set in Momentum. Avoid encouraging them to prioritize goal attainment at the expense of other important tasks, collaboration, quality or well-being.

## Supporting monthly goals and WOOP
Monthly goals provide an opportunity for more sustained development. The WOOP technique helps employees think through their ambitions, imagine the desired outcome, recognize internal obstacles and prepare an action plan.

As a leader, you can help employees reflect on these elements without taking ownership of the process away from them.

For example:

**Wish: What makes this something you would like to develop?**

**Outcome: What would achieving this mean to you?**

**Obstacle: What do you think might hold you back?**

**Plan: What could you do when you encounter that obstacle?**

If an employee identifies a challenging habit, feeling or thought, approach it respectfully. Do not interpret their WOOP reflection as a personal weakness or pressure them to disclose more than they are comfortable sharing.

Also remember that not all obstacles are internal. Workload, insufficient resources, unclear priorities and organizational processes can all influence an employee's ability to make progress.

Consider which obstacles you can help remove.

## Making use of Friday reflections
Friday reflections offer an opportunity to better understand how employees experience their working week.

Read them with an open mind. Look for opportunities to recognize development, understand challenges and identify where your support could make a difference.

Avoid treating reflections as weekly reports that need to be assessed, corrected or judged. There is no ideal answer, level of detail or degree of positivity.

You do not need to respond formally to every reflection. Instead, allow relevant insights to inform your everyday interactions and existing conversations with employees.

## Turning insights into action
When an employee raises a challenge, acknowledging it is a good starting point. Where possible, follow up with practical support.

This might involve clarifying expectations, making resources available, connecting the employee with a colleague, helping them prioritize or creating an opportunity to practise a new skill.

Follow through on the support you offer. This helps demonstrate that sharing experiences through Momentum can lead to meaningful improvements in everyday working life.

The purpose of gathering insights is not simply to know more about your employees, but to become better equipped to support them.`},
{id:'c5',n:'05',title:'The art of motivating feedback',sub:'Communicating in ways that encourage development.',body:`**Good feedback helps people understand how they can move forward, rather than simply telling them how well they have done.**

Feedback is an important opportunity to support employees' motivation, competence and development. However, its effect depends on how it is communicated and experienced.

Feedback that is intended to be encouraging may still feel controlling if employees perceive it as pressure to meet expectations, gain approval or avoid disappointment.

## Be informative rather than controlling
Informative feedback helps employees understand their progress, recognize effective strategies and identify opportunities for improvement.

Controlling feedback places greater emphasis on what employees are expected to do, how they are being judged or whether they are meeting someone else's expectations.

Try to communicate in a way that provides useful information while respecting employees' ability to make decisions and take ownership of their development.

## Listen before offering solutions
Before providing feedback, take the time to understand the employee's perspective.

What may appear to be a simple challenge from your position could be experienced quite differently by the person facing it.

Ask open-ended questions, listen to their reasoning and avoid making assumptions about their motivation, effort or abilities.

Sometimes, feeling heard and understood is itself an important form of support.

## Be specific and constructive
Rather than relying solely on general praise such as "Great job!", help employees recognize what they did well and why it mattered.

Highlight the behaviours, strategies, learning or improvements that contributed to their progress.

When providing corrective feedback, focus on the task, behaviour or approach rather than the employee's personal qualities. Explain what could be improved and explore how they might approach it differently.

Supportive feedback can be both honest and challenging. Being supportive does not mean avoiding difficult conversations or only providing positive feedback.

## Recognize progress, not just results
Employees should not have to complete a goal before receiving encouragement or recognition.

Notice when they take initiative, explore an alternative approach, ask for help, develop a skill or support a colleague. These behaviours can be valuable regardless of whether the original goal is achieved.

## A simple approach to feedback
When having a conversation about an employee's goals or reflections, consider the following four steps:

1. Understand || Invite the employee to share their perspective before drawing conclusions.
2. Acknowledge || Recognize relevant experiences, contributions, learning or progress.
3. Explore || Discuss what might help the employee move forward. Offer constructive observations, guidance or alternative approaches where appropriate.
4. Support || Agree on what would be helpful and follow through on any support you offer.

These steps are not a script that needs to be followed in every conversation. They are a reminder to approach feedback with curiosity, respect and a genuine interest in the employee's development.

[reflect]
## Take a moment to reflect
After providing feedback, ask yourself:

? Did I help this person understand how they can move forward, or did I mainly communicate how I expect them to perform?
[/reflect]`},
{id:'c6',n:'06',title:'Building shared momentum',sub:'Connecting people, developing yourself and sustaining the culture.',body:`Motivation is not shaped by the relationship between an employee and their manager alone. Colleagues, teams and the wider organization also play important roles in how people experience their work.

As a leader, you have an opportunity to strengthen these relationships and help create a culture in which people support each other's development.

## Encourage mutual support
Recognize the value of employees helping one another, sharing knowledge, offering constructive feedback and making time for collaboration.

Encourage genuine appreciation, both through the Bravo! feature and through everyday interactions.

Bravo! should remain a voluntary gesture of encouragement, not an expectation, a measure of engagement or a way to identify who contributes the most.

Remember that meaningful support can take many forms. Listening to a colleague, offering assistance or sharing knowledge may be just as valuable as publicly recognizing an achievement.

## Connect everyday work to a bigger picture
Employees may find greater meaning in their work when they understand why it matters and how it contributes to something beyond their immediate responsibilities.

Help employees see the connections between their own work, the work of their colleagues and the wider purpose of the organization.

Take time to explain why certain activities matter, how different departments depend on one another and what their collective efforts make possible.

## Writing your monthly department update
Your monthly update is an opportunity to make your department's contributions visible, recognize collective progress and strengthen connections across the organization.

When writing your update, consider:
- What has our department been working on this month?
- How have different members of our department contributed?
- What have we learned or become better at?
- What challenges have helped us rethink our approach?
- How have other departments supported our work?
- How does our work contribute to the wider organization?

Focus on collective contributions rather than individual performance. Recognize the less visible work that has enabled progress, including collaboration, knowledge sharing, experimentation and support.

Do not include identifiable information from employees' personal goals or reflections.

There is no need to present every month as a success story. Honest accounts of challenges and learning can be just as valuable as descriptions of achievements.

For senior leaders, monthly organizational updates provide an additional opportunity to connect the contributions of different departments and communicate a sense of shared purpose.

## Recognizing when Momentum is becoming counterproductive
Pay attention to how your employees experience Momentum.

If employees become overly concerned with completing every goal, hesitate to discuss unfinished goals, set goals simply because they are easy to achieve or feel pressured to receive recognition, Momentum may no longer be serving its intended purpose.

Consider whether your own behaviour, team expectations or existing organizational practices might be contributing to these experiences.

Invite employees to share their perspectives and be willing to adjust your approach.

## Develop your own leadership
Just as Momentum encourages employees to reflect on their development, you can use its principles to reflect on your own leadership.

Consider choosing one aspect of your leadership that you would like to develop this month. It might be listening more actively, providing more constructive feedback, recognizing less visible contributions or becoming better at supporting employees' autonomy.

Think about what achieving this would mean, what might hold you back and how you could respond to that obstacle.

Seek feedback from your employees and remain curious about how they experience your leadership.

Small, consistent improvements in everyday interactions can help create a more supportive motivational climate over time.

Your leadership is also a journey of learning and development.

**Our momentum is something we create together.**`}
];

/* ============ lightweight markup ============ */
function mkInline(t){
  let h=esc(t);
  h=h.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  h=h.replace(/(https?:\/\/)?(www\.)?woopmylife\.org\/?/g,'<a href="https://woopmylife.org" target="_blank" rel="noopener">woopmylife.org</a>');
  return h;
}
let mkSeq=0;
/* returns an array of blocks: {html, heading:boolean} */
function mkBlocks(text,opt){
  opt=opt||{};
  if(text===PDF_PENDING) return [{html:`<div class="pdf-ph">${I.info(16)}<span>Text from <b>Content_in_Momentum.pdf</b> goes here, word for word.</span></div>`}];
  const lines=String(text||'').replace(/\r/g,'').split('\n'), out=[];
  let para=[], list=null;
  const flushP=()=>{ if(para.length){ out.push({html:`<p>${mkInline(para.join(' '))}</p>`}); para=[]; } };
  const flushL=()=>{ if(list){ out.push({html:list.type==='ol'?`<ol class="steps">${list.items.map((x,i)=>{const [t,dsc]=x.split(' || ');return `<li><span class="step-n">${i+1}</span><span>${dsc!=null?`<b>${mkInline(t)}</b><br>${mkInline(dsc)}`:mkInline(x)}</span></li>`;}).join('')}</ol>`:`<ul>${list.items.map(x=>`<li>${mkInline(x)}</li>`).join('')}</ul>`}); list=null; } };
  const flush=()=>{flushP();flushL();};
  for(let i=0;i<lines.length;i++){
    const raw=lines[i], l=raw.trim();
    if(!l){ flush(); continue; }
    if(l==='[reflect]'){
      flush(); const inner=[]; i++;
      while(i<lines.length&&lines[i].trim()!=='[/reflect]'){ inner.push(lines[i]); i++; }
      out.push({html:`<div class="reflect">${mkBlocks(inner.join('\n'),opt).map(b=>b.html).join('')}</div>`}); continue;
    }
    if(l.startsWith('Q: ')){
      flush(); const q=l.slice(3), ans=[]; i++;
      while(i<lines.length&&!lines[i].trim().startsWith('Q: ')&&!lines[i].trim().startsWith('## ')){ ans.push(lines[i]); i++; }
      i--;
      const key=(opt.faqKey||'faq')+'-'+(mkSeq++), open=!!ui.faq[key];
      out.push({html:`<div class="faq ${open?'open':''}" data-key="${key}"><button class="faq-btn" data-a="faq" data-v="${key}" aria-expanded="${open}" aria-controls="${key}-p"><span>${mkInline(q)}</span>${I.chev(16)}</button><div class="acc-panel" id="${key}-p" role="region"><div class="acc-inner"><div class="faq-a">${mkBlocks(ans.join('\n'),opt).map(b=>b.html).join('')}</div></div></div></div>`});
      continue;
    }
    if(l.startsWith('## ')){
      flush(); const h=l.slice(3), m=h.match(/^([WOP])\s[–-]\s/);
      out.push({html:`<h3 class="mk-h">${m?`<span class="woop-l">${m[1]}</span>`:''}<span>${mkInline(h)}</span></h3>`,heading:true}); continue;
    }
    if(l.startsWith('> ')){ flush(); out.push({html:`<div class="mk-hl">${mkInline(l.slice(2))}</div>`}); continue; }
    if(l.startsWith('? ')){ flush(); out.push({html:`<div class="ask">${mkInline(l.slice(2))}</div>`}); continue; }
    if(l.startsWith('- ')){ flushP(); if(!list||list.type!=='ul'){flushL();list={type:'ul',items:[]};} list.items.push(l.slice(2)); continue; }
    const num=l.match(/^\d+\.\s(.*)$/);
    if(num){ flushP(); if(!list||list.type!=='ol'){flushL();list={type:'ol',items:[]};} list.items.push(num[1]); continue; }
    flushL(); para.push(l);
  }
  flush();
  return out;
}

  const f=document.getElementById('hb-fab'); if(f) f.focus();

function hbGo(p){ if(hb.busy)return; const t=hbNorm(p); if(t===hb.page)return; hbTurn(t>hb.page?1:-1,t); }
function hbTurn(dir,target){
  if(hb.busy) return;
  const t=target!=null?hbNorm(target):hb.page+dir;
  if(t===hb.page||t<0||t>=hbUnits().length) return;
  const root=document.getElementById('book-root'), book=root.querySelector('.hb-book');
  const old=hb.page; hb.page=t;
  if(!book.animate){ hbPaint(); return; }
  if(reduced()){ hbPaint(); book.animate([{opacity:.35},{opacity:1}],{duration:220}); return; }
  hb.busy=true;
  const L=root.querySelector('#hb-L'), R=root.querySelector('#hb-R');
  const leaf=document.createElement('div'); leaf.className='hb-leaf';
  let frames;
  if(hb.single){
    leaf.classList.add('on-left'); leaf.innerHTML=`<div class="face hb-page">${hbSide(old,'S')}</div>`;
    L.innerHTML=hbSide(t,'S');
    leaf.style.transformOrigin=dir>0?'left center':'right center';
    frames=[{transform:'rotateY(0deg)',opacity:1},{transform:`rotateY(${dir>0?-100:100}deg)`,opacity:0}];
  } else if(dir>0){
    leaf.classList.add('on-right'); leaf.style.transformOrigin='left center';
    leaf.innerHTML=`<div class="face hb-page right">${hbSide(old,'R')}</div><div class="face back hb-page left">${hbSide(t,'L')}</div>`;
    R.innerHTML=hbSide(t,'R');
    frames=[{transform:'rotateY(0deg)'},{transform:'rotateY(-180deg)'}];
  } else {
    leaf.classList.add('on-left'); leaf.style.transformOrigin='right center';
    leaf.innerHTML=`<div class="face hb-page left">${hbSide(old,'L')}</div><div class="face back hb-page right">${hbSide(t,'R')}</div>`;
    L.innerHTML=hbSide(t,'L');
    frames=[{transform:'rotateY(0deg)'},{transform:'rotateY(180deg)'}];
  }
  book.appendChild(leaf);
  leaf.querySelectorAll('button,textarea,input').forEach(x=>x.setAttribute('tabindex','-1'));
  const an=leaf.animate(frames,{duration:hb.single?420:700,easing:'cubic-bezier(.45,.05,.35,1)'});
  an.onfinish=()=>{leaf.remove();hbPaint();hb.busy=false;};
  root.querySelector('.hb-ind').textContent=hbIndicator();
}

  const txt=lines.join('\n');
  const done=()=>{toast('Reflection copied');ui.hbCopied=true;document.querySelectorAll('#book-root .tool-actions').forEach(el=>el.classList.add('copied'));};
  const fallback=()=>{try{const ta=document.createElement('textarea');ta.value=txt;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();const ok=document.execCommand&&document.execCommand('copy');ta.remove();if(ok)done();else toast('Copy is not available in this browser');}catch(e){toast('Copy is not available in this browser');}};
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done,fallback); else fallback();
}

function woopView(g){

/* ============ analysis for AI summary ============ */
function analyse(people){
  const r={size:people.length,monthlySet:0,status:{},weeklyPeople:0,weeklyGoals:0,weeklyDone:0,linked:0,reflected:0,lastWeek:0,woop:0,noWoop:[],
    needs:{autonomy:{pos:[],neg:[]},competence:{pos:[],neg:[]},relatedness:{pos:[],neg:[]}},obstacles:{},noGoals:[],codes:{}};
  people.forEach(p=>{
    const g=state.goals[p.id]; if(!g) return;
    if(g.monthly.text.trim()){r.monthlySet++; r.status[g.monthly.status]=(r.status[g.monthly.status]||0)+1; if(woopDone(g)) r.woop++; else r.noWoop.push(p);}
    const ws=g.weekly.filter(w=>w.text.trim());
    if(ws.length) r.weeklyPeople++; else if(!g.monthly.text.trim()) r.noGoals.push(p);
    r.weeklyGoals+=ws.length; r.weeklyDone+=ws.filter(w=>w.done).length; r.linked+=ws.filter(w=>w.linked).length;
    r.lastWeek+=(state.history[p.id]||[]).slice(-1)[0]||0;
    const rf=state.reflections[p.id];
    if(rf&&rf.saved&&rf.text.trim()){
      r.reflected++;
      const cs=codeText(rf.text); r.codes[p.id]=cs;
      cs.forEach(c=>{ if(r.needs[c.id]) r.needs[c.id][c.sent].push(p); else (r.obstacles[c.id]=r.obstacles[c.id]||[]).push(p); });
    }
  });
  return r;
}
function needLevel(n){ if(!n.pos.length&&!n.neg.length) return ['none','No signals']; if(n.neg.length>n.pos.length) return ['risk','At risk']; if(n.neg.length) return ['mixed','Mixed']; return ['strong','Strong']; }
function aiCard(scope,people,title){
  const a=analyse(people), unit=scope==='org'?'people across the organization':scope==='dept'?'people in the department':'people in the team';
  const st=STATUS.filter(s=>a.status[s]).map(s=>`${a.status[s]} ${s.toLowerCase()}`).join(', ');
  const ov=[];
  ov.push(`${a.monthlySet} of ${a.size} ${unit} have set a monthly goal for ${MONTH}${st?` – ${st}`:''}.`);
  ov.push(`${a.woop} of ${a.monthlySet} have completed a WOOP reflection on their monthly goal (outcome, inner obstacle and an if–then plan)${a.woop<a.monthlySet?' – encourage the rest: naming the inner obstacle and a plan makes goals more likely to be reached':''}.`);
  ov.push(`${a.weeklyDone} of ${a.weeklyGoals} weekly goals are achieved so far this week (last week: ${a.lastWeek}).`);
  if(a.weeklyGoals){ const pct=a.linked/a.weeklyGoals;
    ov.push(pct>=.5?'Most weekly goals are steps toward a monthly goal.'
      :'Fewer weekly goals link to a monthly goal this week – worth asking in 1:1s whether the monthly goal still feels meaningful and within reach.'); }
  ov.push(`${a.reflected} of ${a.size} wrote a Friday reflection. Motivation signals and obstacles below are coded from their text.`);
  const needs=['autonomy','competence','relatedness'].map(k=>{const n=a.needs[k],[cls,lab]=needLevel(n);
    const ev=[n.pos.length?`${n.pos.length} ${NEED_EV[k][0]}`:'',n.neg.length?`${n.neg.length} ${NEED_EV[k][1]}`:''].filter(Boolean).join(' · ')||'Not mentioned this week';
    return `<div class="need"><b>${CODES.find(c=>c.id===k).label}</b><span class="lvl ${cls}">${lab}</span><span class="ev">${esc(ev)}</span></div>`;}).join('');
  const obs=Object.entries(a.obstacles).sort((x,y)=>y[1].length-x[1].length);
  const maxO=Math.max(1,...obs.map(o=>o[1].length));
  const obsHtml=obs.length?`<div class="stack" style="gap:12px">${obs.slice(0,5).map(([id,ps])=>`<div class="bar-row"><div class="bar-top"><span>${esc(CODES.find(c=>c.id===id).label)}</span><b>${ps.length} ${ps.length===1?'person':'people'}</b></div><div class="bar"><span style="width:${Math.round(ps.length/maxO*100)}%"></span></div></div>`).join('')}</div>`:'<div class="ai-sub">No obstacles mentioned this week.</div>';
  let side='';
  if(scope==='dept'){
    const stress=people.filter(p=>(a.codes[p.id]||[]).some(c=>c.id==='energy')).length;
    const row=(n,l)=>`<div class="ci"><div class="stat-v" style="font-size:24px;min-width:44px">${n}</div><div class="why" style="font-size:14px">${l}</div></div>`;
    side=`<div class="ai-block"><h3>Engagement at a glance</h3>${row(a.noGoals.length,'have not set any goals this month')}${row(a.size-a.reflected,'have not written a Friday reflection')}${row(stress,'mention stress or low energy')}<div class="ai-sub" style="margin:10px 0 0">Counts only – the leader follows up individuals.</div></div>`;
  } else if(scope==='team'){
    const flags=[];
    people.forEach(p=>{const why=[];const cs=a.codes[p.id]||[];
      if(a.noGoals.includes(p)) why.push('hasn’t set goals yet');
      cs.filter(c=>c.sent==='neg'&&NEED_TXT[c.id]).forEach(c=>why.push(NEED_TXT[c.id].neg.toLowerCase()));
      if(cs.some(c=>c.id==='energy')) why.push('signs of low energy or stress');
      if(why.length) flags.push(`<div class="ci">${avatarSVG(p,32)}<div><div class="who">${esc(p.name)}</div><div class="why">${esc(why.join(' · '))}</div></div></div>`);
    });
    side=`<div class="ai-block"><h3>Who might need a check-in</h3>${flags.length?flags.slice(0,5).join(''):'<div class="ai-sub">No one stands out this week.</div>'}</div>`;
  } else {
    side=`<div class="ai-block"><h3>Departments at a glance</h3>${DEPTS.map(d=>{const da=analyse(employeesOf(d.id));const o=Object.entries(da.obstacles).sort((x,y)=>y[1].length-x[1].length)[0];
      const weak=['autonomy','competence','relatedness'].map(k=>[k,needLevel(da.needs[k])]).filter(([k,l])=>l[0]==='risk'||l[0]==='mixed').map(([k])=>CODES.find(c=>c.id===k).label);
      return `<div class="ci"><div><div class="who">${d.name}</div><div class="why">${o?'Main obstacle: '+esc(CODES.find(c=>c.id===o[0]).label):'No obstacles mentioned'}${weak.length?' · Watch: '+esc(weak.join(', ')):''}</div></div></div>`;}).join('')}</div>`;
  }
  const acts=[];
  ['autonomy','competence','relatedness'].forEach(k=>{if(a.needs[k].neg.length) acts.push(ACTIONS[k]);});
  obs.slice(0,2).forEach(([id])=>acts.push(ACTIONS[id]));
  if(a.noGoals.length&&scope==='team') acts.push('Have a short, supportive chat with anyone who hasn’t set goals – ask what would make goal-setting useful for them.');
  if(!acts.length) acts.push('Keep doing what works – recognise effort and learning in your next team meeting.');
  return `<section class="ai-card" aria-labelledby="ai-h">
    <div class="ai-head"><div><span class="ai-badge">${I.spark(14,'#17131D')} AI summary</span><h2 id="ai-h">${esc(title)}</h2></div><div class="ai-meta">Week ${WEEK} · based on ${a.monthlySet} monthly goals, ${a.weeklyGoals} weekly goals and ${a.reflected} reflections</div></div>
    <div class="ai-grid">
      <div class="ai-block"><h3>Overview</h3><ul>${ov.map(l=>`<li>${esc(l)}</li>`).join('')}</ul></div>
      <div class="ai-block"><h3>Motivation signals</h3><p class="ai-sub">Basic psychological needs (self-determination theory), coded from reflections</p><div class="needs">${needs}</div></div>
    </div>
    <div class="ai-grid">
      <div class="ai-block"><h3>Key obstacles</h3>${obsHtml}</div>
      ${side}
    </div>
    <div class="ai-block" style="margin-bottom:14px"><h3>Suggested actions</h3><ol>${acts.slice(0,5).map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div>
    <div class="ai-foot">Prototype: reflections are coded with keyword rules and the summary is generated from that coding. A live version would use an AI model to read and code the text. The summary describes the team as a whole to help you support people – it does not rank or evaluate anyone.</div>
  </section>`;
}

/* ============ actions ============ */
function achieve(u,kind,goal){
  const ev={id:uid(),userId:u.id,kind,goal,ts:Date.now(),bravoFrom:[]};state.feed.unshift(ev);
  audienceFor(u).forEach(x=>addNotif(x.id,{type:'achieved',from:u.id,eventId:ev.id,kind,goal}));
  toast('Nice step forward! Your team sees that you reached '+goalNameYou(kind,goal)+' – never what it was.');
  const mates=employeesOf(u.dept).filter(x=>x.id!==u.id), t=mates[Math.floor(Math.random()*mates.length)];
  if(t) setTimeout(()=>{const e=state.feed.find(x=>x.id===ev.id);if(!e||e.bravoFrom.includes(t.id))return;e.bravoFrom.push(t.id);addNotif(u.id,{type:'bravo',from:t.id,kind,goal});save();if(me().id===u.id)toast(t.name+' cheered you on with a Bravo!');render();},2800);
}
function unachieve(u,kind,goal){const k=state.feed.findIndex(e=>e.userId===u.id&&e.kind===kind&&e.goal===goal&&Date.now()-e.ts<7*DAY);if(k>-1)state.feed.splice(k,1);}

  'm-status':v=>{const u=me(),m=state.goals[u.id].monthly;if(!m.text.trim()){toast('Write your monthly goal first');return;}const was=m.status;m.status=v;
    if(v==='Achieved'&&was!=='Achieved')achieve(u,'monthly',0);if(was==='Achieved'&&v!=='Achieved'){unachieve(u,'monthly',0);toast('Goal reopened. Tick it off when it feels done – there’s no rush and no score.');}},
  'w-done':(v,el)=>{const u=me(),i=+el.dataset.i,w=state.goals[u.id].weekly[i];if(!w.text.trim()&&!w.done){toast('Write the goal first');return;}w.done=!w.done;if(w.done)achieve(u,'weekly',i+1);else{unachieve(u,'weekly',i+1);toast('Goal reopened. Tick it off when it feels done – there’s no rush and no score.');}},

  bravo:v=>{const ev=state.feed.find(e=>e.id===v);if(!ev||ev.bravoFrom.includes(me().id))return;ev.bravoFrom.push(me().id);addNotif(ev.userId,{type:'bravo',from:me().id,kind:ev.kind,goal:ev.goal});toast('Bravo! sent to '+user(ev.userId).name);},
  simulate:()=>{const u=me(),mates=employeesOf(u.dept).filter(x=>x.id!==u.id);if(!mates.length)return;const t=mates[state.simIdx%mates.length];state.simIdx++;
    const kind=Math.random()<.25?'monthly':'weekly',g=kind==='monthly'?0:1+Math.floor(Math.random()*2);
    const ev={id:uid(),userId:t.id,kind,goal:g,ts:Date.now(),bravoFrom:[]};state.feed.unshift(ev);
    audienceFor(t).forEach(x=>addNotif(x.id,{type:'achieved',from:t.id,eventId:ev.id,kind,goal:g}));
    toast(t.name+' reached '+goalName(kind,g)+'! You can send a Bravo! from the bell if you like.');},
  filter:v=>{ui.filter=v;},
  'post-open':v=>{ui.open[v]=!ui.open[v];},
  'post-bravo':v=>{const p=state.posts.find(x=>x.id===v);if(p&&!p.bravos.includes(me().id)){p.bravos.push(me().id);toast('Bravo! sent to '+(p.type==='ceo'?user(p.authorId).name:deptName(p.dept)));}},
  'post-new':v=>{const u=me();ui.panel=null;ui.modal={type:'post',draft:{id:null,type:v,dept:v==='ceo'?null:u.dept,month:monthLabel(0),title:'',body:''}};},
  'post-edit':v=>{ui.modal={type:'post',draft:JSON.parse(JSON.stringify(state.posts.find(x=>x.id===v)))};},
  'post-save':status=>{
    const d=ui.modal.draft,u=me();
    if(status==='published'&&!d.title.trim()){toast('Add a title before publishing');return;}
    const old=d.id&&state.posts.find(p=>p.id===d.id), wasPub=old&&old.status==='published';let p;
    if(old){p=old;Object.assign(p,{title:d.title,body:d.body,status:wasPub?'published':status});if(!wasPub&&status==='published')p.ts=Date.now();}
    else{p={id:uid(),type:d.type,dept:d.dept,authorId:u.id,month:d.month,title:d.title,body:d.body,status,ts:Date.now(),bravos:[]};state.posts.push(p);}
    if(p.status==='published'&&!wasPub){Object.keys(state.users).filter(id=>id!==u.id).forEach(id=>addNotif(id,{type:p.type==='ceo'?'ceo':'post',postId:p.id}));toast('Published – everyone has been notified');}
    else toast(p.status==='published'?'Changes saved':'Draft saved');
    ui.modal=null;},
  'avatar-edit':()=>{ui.panel=null;ui.modal={type:'avatar',draft:{...me().avatar}};},
  'av-set':(v,el)=>{ui.modal.draft[el.dataset.k]=v;},
  'av-random':()=>{ui.modal.draft=randomAvatar(Math.floor(Math.random()*1000)+1);},
  'av-save':()=>{me().avatar={...ui.modal.draft};ui.modal=null;toast('Avatar saved');},
  'modal-close':()=>{ui.modal=null;},
  backdrop:(v,el,e)=>{if(e.target===el)ui.modal=null;else return 'skip';},
  'notif-readall':()=>{(state.notifications[me().id]||[]).forEach(n=>n.read=true);},
  'notif-bravo':v=>{const n=state.notifications[me().id].find(x=>x.id===v);n.read=true;A.bravo(n.eventId);},
  'notif-open':v=>{const n=state.notifications[me().id].find(x=>x.id===v);n.read=true;ui.panel=null;
    if(n.type==='achieved')state.tab='team';else if(n.type==='post'||n.type==='ceo'){state.tab='monthly';ui.filter='all';ui.open[n.postId]=true;}else state.tab='dashboard';
    ui.person=null;ui.dept=null;window.scrollTo(0,0);},
  'info-edit':v=>{ui.infoEditing=+v;ui.acc[+v]=true;},
  'info-save':()=>{ui.infoEditing=null;toast('Saved');}
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');
  if(!el){if(ui.panel&&!e.target.closest('.panel')){ui.panel=null;render();}return;}
  if(ui.panel&&!el.closest('.panel')&&el.dataset.a!=='panel')ui.panel=null;
  const fn=A[el.dataset.a];if(!fn)return;
  const r=fn(el.dataset.v,el,e);if(r==='skip')return;
  save();render();ui.flashDemo=false;
});
document.addEventListener('keydown',e=>{
  if(hb.open){
    if(e.key==='Escape'){e.preventDefault();hbClose();return;}
    const typing=/^(TEXTAREA|INPUT)$/.test(e.target.tagName);
    if(!typing&&e.key==='ArrowRight'){e.preventDefault();hbTurn(1);return;}
    if(!typing&&e.key==='ArrowLeft'){e.preventDefault();hbTurn(-1);return;}
    if(e.key==='Tab'){const f=[...document.querySelectorAll('#book-root button:not([disabled]),#book-root textarea,#book-root [href]')].filter(x=>!x.closest('.hb-leaf,.hb-meas')&&x.offsetParent!==null);
      if(!f.length)return;const first=f[0],last=f[f.length-1];
      if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
      else if(!e.target.closest('#book-root')){e.preventDefault();first.focus();}}
  }
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role="button"][data-a]')){e.preventDefault();e.target.click();}
  if(e.key==='Escape'&&(ui.modal||ui.panel)){ui.modal=null;ui.panel=null;render();}
});
document.addEventListener('input',e=>{
  const t=e.target,k=t.dataset&&t.dataset.in;if(!k)return;const u=me();
  if(k==='monthly'){state.goals[u.id].monthly.text=t.value;const wEl=document.querySelector('.woop-wish');if(wEl)wEl.textContent=t.value.trim()?t.value:'Write your monthly goal above';}
  if(k==='woop'){const m=state.goals[u.id].monthly;m.woop=m.woop||{outcome:'',obstacle:'',planIf:'',planThen:''};m.woop[t.dataset.v]=t.value;}
  if(k==='weekly')state.goals[u.id].weekly[+t.dataset.i].text=t.value;
  if(k==='refl'){const r=state.reflections[u.id]=state.reflections[u.id]||{text:'',saved:false};r.text=t.value;}
  if(k==='note')(state.notes[u.id]=state.notes[u.id]||{})[t.dataset.v]=t.value;
  if(k==='info')state.info[+t.dataset.v].body=t.value;
  if(k==='hb-text'){hbState()[t.dataset.v]=t.value;hbUncopy();}
  if(k==='pd-title')ui.modal.draft.title=t.value;
  if(k==='pd-body')ui.modal.draft.body=t.value;
  save();
});
render();
</script>
